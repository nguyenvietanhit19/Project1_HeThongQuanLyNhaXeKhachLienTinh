<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/shared/assets/favicon.png" />
<title>Giá vé — Quản lý</title>
<link rel="stylesheet" href="/shared/design-tokens.css" />
<link rel="stylesheet" href="/nhan-vien/quan-ly/style.css" />
</head>
<body class="nhan-vien-shell">
  <div class="nv-layout">
    <aside class="nv-sidebar" id="nv-sidebar"></aside>

    <div class="nv-main">
      <header class="nv-topbar">
        <h1>Giá vé</h1>
      </header>

      <main class="nv-content gv-content">
        <div class="gv-thong-ke" id="gv-thong-ke"></div>

        <div class="gv-layout">
          <aside class="gv-khung gv-ds">
            <input class="input-field gv-tim" type="search" id="gv-tim" placeholder="Tìm tuyến hoặc mã tuyến..." />
            <div class="gv-ds__list" id="gv-ds-tuyen">Đang tải...</div>
          </aside>

          <section class="gv-khung gv-chi-tiet" id="gv-chi-tiet"></section>
        </div>
      </main>
    </div>
  </div>

  <div class="nv-modal-overlay" id="modal-overlay" hidden>
    <div class="nv-modal" style="max-width:640px;">
      <form id="form-bo">
        <div class="nv-modal__header">
          <div class="nv-modal__header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><path d="M9 15V9l1.8 1.8L12 9l1.2 1.8L15 9v6"/>
            </svg>
          </div>
          <h2 id="modal-tieu-de">Tạo bộ giá vé mới</h2>
        </div>
        <div class="nv-modal__body">
          <input type="hidden" id="bo_id" />
          <p id="ten-tuyen-da-chon" class="pill pill--nhom-tuyen" style="display:inline-block; margin:0 0 14px;"></p>

          <div id="buoc-nhap">
            <div class="nv-form-row">
              <div>
                <label class="nv-label" for="ap_dung_tu">Áp dụng từ ngày</label>
                <input class="input-field" type="date" id="ap_dung_tu" />
              </div>
              <div>
                <label class="nv-label" for="ap_dung_den">Đến ngày</label>
                <input class="input-field" type="date" id="ap_dung_den" required />
              </div>
            </div>

            <div class="gv-bang-nhap" id="bang-nhap-gia"></div>

            <div id="loi-form" class="text-error" hidden></div>
            <div class="nv-modal__actions">
              <button type="button" class="nv-btn-secondary" id="btn-huy">Hủy</button>
              <button type="submit" class="btn-primary">Tiếp tục</button>
            </div>
          </div>

          <div id="buoc-xac-nhan" hidden>
            <div id="xn-noi-dung" class="gv-xac-nhan"></div>
            <div id="xn-loi" class="text-error" hidden></div>
            <div class="nv-modal__actions">
              <button type="button" class="nv-btn-secondary" id="btn-quay-lai">Quay lại sửa</button>
              <button type="button" class="btn-primary" id="btn-xac-nhan">Xác nhận lưu</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/nhan-vien/quan-ly/api-client.js"></script>
  <script src="/nhan-vien/quan-ly/auth-check.js"></script>
  <script src="/nhan-vien/quan-ly/nav.js"></script>
  <script src="/nhan-vien/quan-ly/tai-khoan.js"></script>
  <script>
    const nguoiDung = yeuCauVaiTro("quan_ly", "quan_ly_nhan_su");
    if (nguoiDung) {
      renderSidebar(document.getElementById("nv-sidebar"), "/nhan-vien/quan-ly/gia-ve.html");
    }

    const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const dinhDangTien = (so) => Number(so).toLocaleString("vi-VN") + "đ";
    const dinhDangNgay = (iso) => (iso ? iso.split("-").reverse().join("/") : "");
    const khoaNgay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const homNayISO = () => khoaNgay(new Date());
    const ngayMaiISO = () => {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return khoaNgay(d);
    };

    let dsTuyen = [];
    let dsBo = []; // mọi bộ giá của mọi tuyến (cũ → mới trong từng tuyến)
    let khuVucTheoTuyen = new Map(); // tuyen_id -> [{khu_vuc_id, ten}] theo đúng thứ tự tuyến đi qua
    let phanTichTheoTuyen = new Map(); // tuyen_id -> kết quả phanTichTuyen()
    let tuyenDangChon = null;
    let boLoc = TrangThaiTrang.doc().boLoc || "tat_ca"; // tat_ca | on_dinh | sap_het | het_han
    let tuKhoa = TrangThaiTrang.doc().tuKhoa || "";

    const NGUONG_SAP_HET_NGAY = 14; // bộ giá cuối còn ≤ 14 ngày là "sắp hết hạn"
    const SO_NGAY_THANH_TIEN_DO = 60; // thanh tiến độ đầy khi còn ≥ 60 ngày có giá
    const NHAN_TRANG_THAI_BO = {
      dang_ap_dung: ["Đang áp dụng", "pill--gia-vinh-vien"],
      sap_ap_dung: ["Sắp áp dụng", "pill--gia-thoi-han"],
      da_ket_thuc: ["Đã kết thúc", "pill--xam"],
    };

    const boCuaTuyen = (id) => dsBo.filter((b) => b.tuyen_id === id).sort((a, b) => a.ap_dung_tu.localeCompare(b.ap_dung_tu));
    const boHienHanh = (id) => boCuaTuyen(id).find((b) => b.trang_thai === "dang_ap_dung") || null;

    // Mọi chặng (điểm đi đứng trước điểm đến theo chiều đi của tuyến) — khớp logic backend (gia_ve_service._cac_cap_cua_tuyen)
    function cacChangCuaTuyen(tuyenId) {
      const kv = khuVucTheoTuyen.get(tuyenId) || [];
      const ds = [];
      for (let i = 0; i < kv.length; i++) {
        for (let j = i + 1; j < kv.length; j++) ds.push({ di: kv[i].khu_vuc_id, den: kv[j].khu_vuc_id, ten_di: kv[i].ten, ten_den: kv[j].ten });
      }
      return ds;
    }

    // ---------- Phân tích hạn có giá của 1 tuyến ----------
    // Bộ giá luôn đủ mọi chặng (server chặn nhập thiếu) và nối liền nhau, nên điều đáng lo là THỜI HẠN: sinh chuyến
    // chỉ được trong khoảng các bộ giá, hết bộ cuối là khách không còn thấy chuyến mới.
    function soNgayTu(homNay, ngay) {
      return Math.round((new Date(ngay) - new Date(homNay)) / 86400000);
    }

    function phanTichTuyen(tuyen) {
      const cacBo = boCuaTuyen(tuyen.id);
      const homNay = khoaNgay(new Date());
      if (!cacBo.length) {
        return { trangThai: "het_han", nhan: "Chưa có giá", ghiChu: "Chưa có bộ giá nào — chưa sinh được chuyến.", conLai: 0, ngan: "—" };
      }
      const boCuoi = cacBo[cacBo.length - 1];
      if (boCuoi.ap_dung_den < homNay) {
        return { trangThai: "het_han", nhan: "Hết hạn", ghiChu: `Giá đã hết hạn từ ${dinhDangNgay(boCuoi.ap_dung_den)} — tạo bộ giá mới để tiếp tục bán.`, conLai: 0, ngan: "hết hạn" };
      }
      const conLai = soNgayTu(homNay, boCuoi.ap_dung_den) + 1;
      if (cacBo[0].ap_dung_tu > homNay) {
        return { trangThai: "sap_het", nhan: "Chưa áp dụng", ghiChu: `Bộ giá đầu tiên áp dụng từ ${dinhDangNgay(cacBo[0].ap_dung_tu)}.`, conLai, ngan: `từ ${dinhDangNgay(cacBo[0].ap_dung_tu)}` };
      }
      if (conLai <= NGUONG_SAP_HET_NGAY) {
        return { trangThai: "sap_het", nhan: "Sắp hết hạn", ghiChu: `Giá chỉ còn đến ${dinhDangNgay(boCuoi.ap_dung_den)} (${conLai} ngày) — gia hạn hoặc tạo bộ giá mới để không gián đoạn.`, conLai, ngan: `còn ${conLai} ngày` };
      }
      return { trangThai: "on_dinh", nhan: "Đang có giá", ghiChu: "", conLai, ngan: `còn ${conLai} ngày` };
    }

    function tinhLaiPhanTich() {
      phanTichTheoTuyen = new Map(dsTuyen.map((t) => [t.id, phanTichTuyen(t)]));
    }

    // ---------- Thanh thống kê (bấm để lọc danh sách) ----------
    function renderThongKe() {
      const dem = { on_dinh: 0, sap_het: 0, het_han: 0 };
      phanTichTheoTuyen.forEach((p) => dem[p.trangThai]++);
      const the = [
        { loc: "tat_ca", nhan: "Tất cả tuyến", so: dsTuyen.length, lop: "tat-ca" },
        { loc: "on_dinh", nhan: "Đang có giá", so: dem.on_dinh, lop: "on-dinh" },
        { loc: "sap_het", nhan: "Sắp hết hạn", so: dem.sap_het, lop: "sap-het" },
        { loc: "het_han", nhan: "Hết hạn / chưa có giá", so: dem.het_han, lop: "het-han" },
      ];
      const box = document.getElementById("gv-thong-ke");
      box.innerHTML = the
        .map(
          (t) => `
            <button type="button" class="gv-stat gv-stat--${t.lop}${boLoc === t.loc ? " is-active" : ""}" data-loc="${t.loc}">
              <span class="gv-stat__so">${t.so}</span>
              <span class="gv-stat__nhan">${t.nhan}</span>
            </button>`
        )
        .join("");
      box.querySelectorAll("[data-loc]").forEach((btn) => {
        btn.addEventListener("click", () => {
          boLoc = boLoc === btn.dataset.loc ? "tat_ca" : btn.dataset.loc;
          TrangThaiTrang.luu({ boLoc });
          renderThongKe();
          renderDanhSachTuyen();
        });
      });
    }

    // ---------- Danh sách tuyến bên trái ----------
    function tuyenDaLoc() {
      const tk = tuKhoa.trim().toLowerCase();
      return dsTuyen
        .filter((t) => (boLoc === "tat_ca" || phanTichTheoTuyen.get(t.id).trangThai === boLoc) && (!tk || t.ten.toLowerCase().includes(tk) || t.ma.toLowerCase().includes(tk)))
        .sort((a, b) => a.ma.localeCompare(b.ma, "vi", { numeric: true })); // theo mã tuyến: T001, T002, ... T010
    }

    function renderDanhSachTuyen() {
      const box = document.getElementById("gv-ds-tuyen");
      const ds = tuyenDaLoc();
      if (!ds.length) {
        box.innerHTML = `<div class="gv-trong">${dsTuyen.length ? "Không có tuyến nào khớp." : "Chưa có tuyến — tạo ở mục Tuyến trước."}</div>`;
        return;
      }
      box.innerHTML = ds
        .map((t) => {
          const p = phanTichTheoTuyen.get(t.id);
          const phanTram = Math.min(100, Math.round((p.conLai / SO_NGAY_THANH_TIEN_DO) * 100));
          return `
            <button type="button" class="gv-tuyen gv-tuyen--${p.trangThai.replace("_", "-")}${t.id === tuyenDangChon ? " is-active" : ""}" data-id="${t.id}">
              <span class="gv-tuyen__cham"></span>
              <span class="gv-tuyen__ten"><span class="ma-tag">${esc(t.ma)}</span> ${esc(t.ten)}</span>
              <span class="gv-tuyen__dem">${p.ngan}</span>
              <span class="gv-tuyen__thanh"><i style="width:${phanTram}%"></i></span>
            </button>`;
        })
        .join("");
      box.querySelectorAll("[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          tuyenDangChon = btn.dataset.id;
          TrangThaiTrang.luu({ tuyenDangChon });
          renderDanhSachTuyen();
          renderChiTiet();
        });
      });
    }

    document.getElementById("gv-tim").value = tuKhoa;
    document.getElementById("gv-tim").addEventListener("input", (e) => {
      tuKhoa = e.target.value;
      TrangThaiTrang.luu({ tuKhoa });
      renderDanhSachTuyen();
    });

    // ---------- Chi tiết các bộ giá của tuyến đang chọn (bên phải) ----------
    function theBo(b) {
      const [nhan, lop] = NHAN_TRANG_THAI_BO[b.trang_thai];
      const thoiHan = `Từ ${dinhDangNgay(b.ap_dung_tu)} đến ${dinhDangNgay(b.ap_dung_den)}`;
      // Bộ cuối đã khóa vẫn đổi được ngày kết thúc (gia hạn); bộ ở giữa đã khóa thì không đổi được gì; chỉ xóa được bộ cuối chưa khóa
      const nutSua = b.khoa && b.la_bo_cuoi ? "Gia hạn" : "Sửa";
      const khoaSua = b.khoa && !b.la_bo_cuoi;
      const khoaXoa = b.khoa || !b.la_bo_cuoi;
      const dongGia = b.danh_sach_gia
        .map((g) => `<tr><td><strong>${esc(g.ten_diem_di)}</strong> <span class="nv-text-phu">→</span> <strong>${esc(g.ten_diem_den)}</strong></td><td class="gv-bo__gia">${dinhDangTien(g.gia_goc)}</td></tr>`)
        .join("");
      return `
        <div class="gv-bo gv-bo--${b.trang_thai.replace("_", "-")}">
          <div class="gv-bo__dau">
            <strong class="gv-bo__ten">${thoiHan}</strong>
            <span class="pill pill--nho ${lop}">${nhan}</span>
            ${b.khoa ? `<span class="gv-khoa" title="Đã có ${b.so_chuyen_da_sinh} chuyến được sinh theo bộ giá này — không sửa/xóa được">🔒 ${b.so_chuyen_da_sinh} chuyến</span>` : ""}
            <span class="gv-bo__nut">
              <button type="button" class="nv-btn-sua${khoaSua ? " is-khoa" : ""}" data-sua="${b.id}">${nutSua}</button>
              <button type="button" class="nv-btn-xoa${khoaXoa ? " is-khoa" : ""}" data-xoa="${b.id}">Xóa</button>
            </span>
          </div>
          <table class="gv-bo__bang"><tbody>${dongGia}</tbody></table>
        </div>`;
    }

    function renderChiTiet() {
      const box = document.getElementById("gv-chi-tiet");
      const tuyen = dsTuyen.find((t) => t.id === tuyenDangChon);
      if (!tuyen) {
        box.innerHTML = `<div class="gv-trong gv-trong--lon">${dsTuyen.length ? "Chọn 1 tuyến ở danh sách bên trái." : "Chưa có tuyến nào."}</div>`;
        return;
      }
      const p = phanTichTheoTuyen.get(tuyen.id);
      const phanTram = Math.min(100, Math.round((p.conLai / SO_NGAY_THANH_TIEN_DO) * 100));
      const cacBo = boCuaTuyen(tuyen.id).slice().reverse(); // mới nhất lên đầu
      const boCuoi = cacBo[0] || null;
      const daHetHan = boCuoi && boCuoi.trang_thai === "da_ket_thuc";

      box.innerHTML = `
        <div class="gv-ct__dau">
          <h2>${htmlMa(tuyen.ma)} ${esc(tuyen.ten)}</h2>
          <span class="gv-badge gv-badge--${p.trangThai.replace("_", "-")}">${p.nhan}</span>
          ${boCuoi ? `<span class="pill pill--nho ${daHetHan ? "pill--gia-thoi-han" : "pill--khu-vuc"}" title="Chỉ sinh được chuyến trong khoảng các bộ giá">${daHetHan ? "Đã hết hạn" : "Có giá đến"} ${dinhDangNgay(boCuoi.ap_dung_den)}</span>` : ""}
          <button class="btn-primary nv-btn-them gv-ct__them" id="btn-them" type="button">+ Tạo bộ giá mới</button>
        </div>

        <div class="gv-ct__tien-do">
          <div class="gv-ct__thanh gv-ct__thanh--${p.trangThai.replace("_", "-")}"><i style="width:${phanTram}%"></i></div>
          <span>${p.ghiChu ? esc(p.ghiChu) : `Có giá <strong>${p.ngan}</strong> — sinh chuyến được đến hết bộ giá cuối`}</span>
        </div>

        <div class="gv-bo-ds">${cacBo.length ? cacBo.map(theBo).join("") : '<div class="gv-trong">Chưa có bộ giá nào — bấm "Tạo bộ giá mới" để nhập giá cho các chặng của tuyến.</div>'}</div>`;

      document.getElementById("btn-them").addEventListener("click", () => moModal(null));
      box.querySelectorAll("[data-sua]").forEach((btn) => btn.addEventListener("click", () => suaBo(btn.dataset.sua)));
      box.querySelectorAll("[data-xoa]").forEach((btn) => btn.addEventListener("click", () => xoaBo(btn.dataset.xoa)));
    }

    function renderTatCa() {
      tinhLaiPhanTich();
      renderThongKe();
      renderDanhSachTuyen();
      renderChiTiet();
    }

    // ---------- Nạp dữ liệu ----------
    async function taiBoGia() {
      dsBo = await apiGet("/quan-ly/bo-gia");
    }

    async function taiBanDau() {
      dsTuyen = await apiGet("/quan-ly/tuyen");
      const [, chiTiets] = await Promise.all([taiBoGia(), Promise.all(dsTuyen.map((t) => apiGet(`/quan-ly/tuyen/${t.id}`)))]);
      dsTuyen.forEach((t, idx) => {
        const daThay = new Map();
        [...chiTiets[idx].danh_sach_diem]
          .sort((a, b) => a.thu_tu - b.thu_tu)
          .forEach((d) => {
            if (!daThay.has(d.khu_vuc_id)) daThay.set(d.khu_vuc_id, d.ten_khu_vuc);
          });
        khuVucTheoTuyen.set(t.id, [...daThay.entries()].map(([khu_vuc_id, ten]) => ({ khu_vuc_id, ten })));
      });
      tinhLaiPhanTich();
      // Quay lại trang thì mở lại đúng tuyến đang xem lần trước; lần đầu thì mở tuyến đầu danh sách
      const tuyenDaLuu = TrangThaiTrang.doc().tuyenDangChon;
      tuyenDangChon = dsTuyen.some((t) => t.id === tuyenDaLuu) ? tuyenDaLuu : tuyenDaLoc()[0]?.id || null;
      renderTatCa();
    }

    async function lamMoiSauKhiDoiGia() {
      await taiBoGia();
      renderTatCa();
    }

    function baoKhoa(b) {
      alert(`Bộ giá này đã có ${b.so_chuyen_da_sinh} chuyến được sinh ra nên không sửa giá hay ngày bắt đầu được.\nMuốn đổi giá: bấm "Tạo bộ giá mới" — bộ mới nối tiếp ngay sau bộ cuối cùng.`);
    }

    async function xoaBo(id) {
      const b = dsBo.find((x) => x.id === id);
      if (!b.la_bo_cuoi) return alert("Chỉ xóa được bộ giá cuối cùng của tuyến — xóa bộ ở giữa sẽ làm hở giữa các bộ.");
      if (b.khoa) return alert(`Không thể xóa: bộ giá này đã có ${b.so_chuyen_da_sinh} chuyến được sinh ra.\nMuốn đổi giá: bấm "Tạo bộ giá mới" nối tiếp.`);
      if (!confirm(`Xóa bộ giá áp dụng từ ${dinhDangNgay(b.ap_dung_tu)}? Không thể hoàn tác.`)) return;
      try {
        await apiDelete(`/quan-ly/bo-gia/${id}`);
        lamMoiSauKhiDoiGia();
      } catch (err) {
        alert(err.message);
      }
    }

    taiBanDau().catch((err) => {
      document.getElementById("gv-ds-tuyen").innerHTML = `<div class="text-error">${esc(err.message)}</div>`;
    });

    // ---------- Modal tạo/sửa bộ giá: bước 1 nhập → bước 2 xem trước & xác nhận ----------
    const modalOverlay = document.getElementById("modal-overlay");
    const form = document.getElementById("form-bo");
    const loiForm = document.getElementById("loi-form");
    const oApDungTu = document.getElementById("ap_dung_tu");
    const oApDungDen = document.getElementById("ap_dung_den");
    // Cộng/trừ số ngày cho chuỗi yyyy-mm-dd (tính theo giờ trưa để không lệch múi giờ)
    const congNgay = (iso, n) => {
      const d = new Date(`${iso}T12:00:00`);
      d.setDate(d.getDate() + n);
      return khoaNgay(d);
    };
    oApDungTu.addEventListener("change", () => {
      if (oApDungTu.value) oApDungDen.min = oApDungTu.value;
    });
    const buocNhap = document.getElementById("buoc-nhap");
    const buocXacNhan = document.getElementById("buoc-xac-nhan");
    let banXemTruoc = null; // { duongDan, duLieu, ketQua }

    // boNen: bộ lấy giá điền sẵn; boThamChieu: bộ hiển thị ở cột "Giá hiện tại" để đối chiếu (có thể không có)
    function veBangNhap(chang, giaDienSan, giaThamChieu) {
      document.getElementById("bang-nhap-gia").innerHTML = `
        <table class="gv-form-bang">
          <thead><tr><th>Chặng</th><th>${giaThamChieu ? "Giá hiện tại" : ""}</th><th>Giá gốc (VNĐ)</th></tr></thead>
          <tbody>
            ${chang
              .map((c) => {
                const k = `${c.di}|${c.den}`;
                const cu = giaThamChieu ? giaThamChieu.get(k) : null;
                const dien = giaDienSan.get(k);
                return `<tr>
                  <td><strong>${esc(c.ten_di)}</strong> <span class="nv-text-phu">→</span> <strong>${esc(c.ten_den)}</strong></td>
                  <td class="nv-text-phu">${cu ? dinhDangTien(cu) : "—"}</td>
                  <td>
                    <input class="input-field gv-o-gia" type="number" min="10000" step="10000" required data-di="${c.di}" data-den="${c.den}" value="${dien ?? ""}" placeholder="VD 300000 (bội số của 10.000)" />
                    <b class="gv-gia-dinh-dang"></b>
                  </td>
                </tr>`;
              })
              .join("")}
          </tbody>
        </table>`;
      document.querySelectorAll("#bang-nhap-gia .gv-o-gia").forEach((o) => {
        const hien = () => (o.parentElement.querySelector(".gv-gia-dinh-dang").textContent = Number(o.value) > 0 ? dinhDangTien(o.value) : "");
        o.addEventListener("input", hien);
        hien();
      });
    }

    const giaTheoCap = (b) => new Map((b?.danh_sach_gia || []).map((g) => [`${g.diem_di_id}|${g.diem_den_id}`, g.gia_goc]));

    // bo = null: tạo mới; bo = đối tượng bộ: sửa
    function moModal(bo) {
      const tuyen = dsTuyen.find((t) => t.id === tuyenDangChon);
      const chang = cacChangCuaTuyen(tuyen.id);
      if (!chang.length) {
        alert("Tuyến này chưa đủ khu vực hợp lệ để cấu hình giá — kiểm tra lại mục Tuyến.");
        return;
      }
      document.getElementById("modal-tieu-de").textContent = bo ? (bo.khoa ? "Gia hạn bộ giá vé" : "Sửa bộ giá vé") : "Tạo bộ giá vé mới";
      document.getElementById("bo_id").value = bo ? bo.id : "";
      document.getElementById("ten-tuyen-da-chon").textContent = tuyen.ten;
      const cacBo = boCuaTuyen(tuyen.id);
      let giaDienSan, giaThamChieu;
      let khoaGia = false;
      if (bo) {
        giaDienSan = giaTheoCap(bo);
        const truoc = cacBo.filter((b) => b.ap_dung_tu < bo.ap_dung_tu).pop();
        giaThamChieu = truoc ? giaTheoCap(truoc) : null;
        oApDungTu.value = bo.ap_dung_tu;
        oApDungDen.value = bo.ap_dung_den;
        // Chỉ bộ đầu tiên (chưa khóa) đổi được ngày bắt đầu; chỉ bộ cuối đổi được ngày kết thúc; bộ đã khóa không đổi giá
        oApDungTu.disabled = !(bo.ap_dung_tu === cacBo[0].ap_dung_tu && !bo.khoa);
        oApDungDen.disabled = !bo.la_bo_cuoi;
        oApDungTu.min = homNayISO();
        oApDungDen.min = bo.khoa && bo.ngay_chuyen_cuoi ? bo.ngay_chuyen_cuoi : bo.ap_dung_tu; // không rút ngắn trước chuyến đã sinh
        khoaGia = bo.khoa;
      } else {
        const nen = boHienHanh(tuyen.id) || cacBo[cacBo.length - 1] || null; // điền sẵn từ bộ đang áp dụng để chỉ cần sửa chặng cần đổi
        giaDienSan = giaTheoCap(nen);
        giaThamChieu = nen ? giaTheoCap(nen) : null;
        // Bộ mới luôn nối liền bộ cuối (bắt đầu ngày liền sau); bộ đầu tiên của tuyến thì mặc định từ ngày mai
        const batDau = cacBo.length ? congNgay(cacBo[cacBo.length - 1].ap_dung_den, 1) : ngayMaiISO();
        oApDungTu.value = batDau;
        oApDungTu.disabled = cacBo.length > 0;
        oApDungTu.min = homNayISO();
        oApDungDen.disabled = false;
        oApDungDen.min = batDau;
        const macDinhDen = congNgay(batDau, 29); // gợi ý 30 ngày, sửa tự do
        oApDungDen.value = macDinhDen >= homNayISO() ? macDinhDen : congNgay(homNayISO(), 29);
      }
      veBangNhap(chang, giaDienSan, giaThamChieu);
      document.querySelectorAll("#bang-nhap-gia .gv-o-gia").forEach((o) => { o.disabled = khoaGia; });
      loiForm.hidden = true;
      buocNhap.hidden = false;
      buocXacNhan.hidden = true;
      form.classList.remove("dang-xac-nhan");
      modalOverlay.hidden = false;
    }

    function suaBo(id) {
      const b = dsBo.find((x) => x.id === id);
      if (b.khoa && !b.la_bo_cuoi) return baoKhoa(b);
      moModal(b);
    }

    document.getElementById("btn-huy").addEventListener("click", () => { modalOverlay.hidden = true; });

    function veXacNhan(ketQua, tenTuyen) {
      const coCanhBao = ketQua.canh_bao.length > 0;
      const doi = ketQua.thay_doi.filter((c) => c.gia_cu !== c.gia_moi);
      const giuNguyen = ketQua.thay_doi.length - doi.length;
      const thoiHan = `từ ${dinhDangNgay(ketQua.ap_dung_tu)} đến ${dinhDangNgay(ketQua.ap_dung_den)}`;
      const dongBoTruoc = ketQua.bo_truoc
        ? `<div class="gv-xn-dong">Nối tiếp bộ giá trước (từ ${dinhDangNgay(ketQua.bo_truoc.ap_dung_tu)} đến <b>${dinhDangNgay(ketQua.bo_truoc.ap_dung_den)}</b>)</div>`
        : "";
      const boCu = banXemTruoc && banXemTruoc.boCu;
      const dongDoiNgay = boCu && boCu.ap_dung_den !== ketQua.ap_dung_den
        ? `<div class="gv-xn-dong">Ngày kết thúc: ${dinhDangNgay(boCu.ap_dung_den)} → <b>${dinhDangNgay(ketQua.ap_dung_den)}</b></div>`
        : "";
      const dongDoi = doi
        .map((c) => `<li><strong>${esc(c.ten_chang)}</strong>: ${c.gia_cu ? `${dinhDangTien(c.gia_cu)} → ` : ""}<b>${dinhDangTien(c.gia_moi)}</b></li>`)
        .join("");
      document.getElementById("xn-noi-dung").innerHTML = `
        <div class="gv-xn-chang">${esc(tenTuyen)}</div>
        <div class="gv-xn-tieu">Bộ giá áp dụng ${thoiHan}</div>
        ${dongBoTruoc}
        ${dongDoiNgay}
        <ul class="gv-xn-doi">${boCu && boCu.khoa ? "<li>Giá các chặng giữ nguyên</li>" : dongDoi || "<li>Không chặng nào đổi giá</li>"}</ul>
        ${giuNguyen && doi.length && !(boCu && boCu.khoa) ?`<div class="nv-text-phu">${giuNguyen} chặng còn lại giữ nguyên giá</div>` : ""}
        ${coCanhBao ? `<ul class="gv-xn-canh-bao">${ketQua.canh_bao.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}`;
      const btn = document.getElementById("btn-xac-nhan");
      btn.textContent = coCanhBao ? "Tôi chắc chắn, vẫn lưu" : "Xác nhận lưu";
      btn.classList.toggle("gv-nut-nguy-hiem", coCanhBao);
      document.getElementById("xn-loi").hidden = true;
      buocNhap.hidden = true;
      buocXacNhan.hidden = false;
      form.classList.add("dang-xac-nhan");
    }

    document.getElementById("btn-quay-lai").addEventListener("click", () => {
      buocXacNhan.hidden = true;
      buocNhap.hidden = false;
      form.classList.remove("dang-xac-nhan");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      loiForm.hidden = true;
      const id = document.getElementById("bo_id").value;
      const danhSachGia = [...document.querySelectorAll("#bang-nhap-gia .gv-o-gia")].map((o) => ({
        diem_di_id: o.dataset.di,
        diem_den_id: o.dataset.den,
        gia_goc: Number(o.value),
      }));
      if (danhSachGia.some((g) => !(g.gia_goc > 0))) {
        loiForm.textContent = "Nhập giá cho đủ mọi chặng của tuyến";
        loiForm.hidden = false;
        return;
      }
      if (danhSachGia.some((g) => g.gia_goc % 10000 !== 0)) {
        loiForm.textContent = "Giá mỗi chặng phải là bội số của 10.000đ (VD 300.000, 310.000)";
        loiForm.hidden = false;
        return;
      }
      if (!oApDungDen.value) {
        loiForm.textContent = "Chọn ngày kết thúc của bộ giá";
        loiForm.hidden = false;
        return;
      }
      const duLieu = { ap_dung_tu: oApDungTu.value || null, ap_dung_den: oApDungDen.value, danh_sach_gia: danhSachGia };
      let duongDan;
      if (id) {
        duongDan = { xem: `/quan-ly/bo-gia/${id}/xem-truoc`, luu: `/quan-ly/bo-gia/${id}`, phuongThuc: apiPut };
      } else {
        duLieu.tuyen_id = tuyenDangChon;
        duongDan = { xem: "/quan-ly/bo-gia/xem-truoc", luu: "/quan-ly/bo-gia", phuongThuc: apiPost };
      }
      const btnSubmit = form.querySelector("button[type=submit]");
      btnSubmit.classList.add("is-loading");
      try {
        const ketQua = await apiPost(duongDan.xem, duLieu);
        banXemTruoc = { duongDan, duLieu, ketQua, boCu: id ? dsBo.find((b) => b.id === id) : null };
        veXacNhan(ketQua, dsTuyen.find((t) => t.id === tuyenDangChon)?.ten || "");
      } catch (err) {
        loiForm.textContent = err.message;
        loiForm.hidden = false;
      } finally {
        btnSubmit.classList.remove("is-loading");
      }
    });

    document.getElementById("btn-xac-nhan").addEventListener("click", async () => {
      if (!banXemTruoc) return;
      const { duongDan, duLieu, ketQua } = banXemTruoc;
      const btn = document.getElementById("btn-xac-nhan");
      btn.classList.add("is-loading");
      try {
        await duongDan.phuongThuc(duongDan.luu, { ...duLieu, ap_dung_tu: ketQua.ap_dung_tu, ap_dung_den: ketQua.ap_dung_den, xac_nhan_canh_bao: ketQua.canh_bao.length > 0 });
        modalOverlay.hidden = true;
        banXemTruoc = null;
        lamMoiSauKhiDoiGia();
      } catch (err) {
        const loi = document.getElementById("xn-loi");
        loi.textContent = err.message;
        loi.hidden = false;
      } finally {
        btn.classList.remove("is-loading");
      }
    });
  </script>
</body>
</html>
