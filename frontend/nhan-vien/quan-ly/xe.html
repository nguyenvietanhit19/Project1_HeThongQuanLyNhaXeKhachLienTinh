<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/shared/assets/favicon.png" />
<title>Xe — Quản lý</title>
<link rel="stylesheet" href="/shared/design-tokens.css" />
<link rel="stylesheet" href="/nhan-vien/quan-ly/style.css" />
<link rel="stylesheet" href="/nhan-vien/quan-ly/thong-bao.css" />
<link rel="stylesheet" href="/nhan-vien/quan-ly/bien-che-modal.css" />
</head>
<body class="nhan-vien-shell">
  <div class="nv-layout">
    <aside class="nv-sidebar" id="nv-sidebar"></aside>

    <div class="nv-main">
      <header class="nv-topbar">
        <h1>Xe</h1>
      </header>

      <main class="nv-content">
        <div class="nv-page-intro">
          <div class="nv-page-intro__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="11" rx="2.5"/><path d="M3 11h18M7 16v3M17 16v3"/><circle cx="7.5" cy="13.5" r="0.8"/><circle cx="16.5" cy="13.5" r="0.8"/>
            </svg>
          </div>
          <div class="nv-page-intro__body">
            <p class="nv-page-intro__title">Xe & biên chế</p>
            <p class="nv-page-intro__desc">Mỗi xe có biển số, loại xe, điểm gốc (văn phòng), có thể cố định 1 tuyến (cả 2 chiều) hoặc là xe dự phòng, và biên chế cố định gồm đúng 2 tài xế + ít nhất 1 phụ xe.</p>
          </div>
          <div class="nv-page-intro__stat">
            <span class="nv-page-intro__stat-num" id="stat-so-luong">—</span>
            <span class="nv-page-intro__stat-label">xe</span>
          </div>
        </div>

        <div class="kv-thanh-cong">
          <div class="kv-tim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="xe-tim" placeholder="Tìm theo biển số, loại xe hoặc tuyến..." autocomplete="off" />
          </div>
          <select class="input-field tb-select" id="xe-loc-loai" aria-label="Lọc theo loại xe"></select>
          <select class="input-field tb-select" id="xe-loc-tuyen" aria-label="Lọc theo tuyến"></select>
          <div class="dd-chips" id="xe-chips"></div>
          <button class="btn-primary nv-btn-them" id="btn-them" type="button">+ Thêm xe</button>
        </div>
        <div class="xe-canh-bao" id="xe-canh-bao-nhan-su" hidden></div>
        <div id="bang-xe">Đang tải...</div>
      </main>
    </div>
  </div>

  <!-- Modal thêm/sửa xe -->
  <div class="nv-modal-overlay" id="modal-overlay" hidden>
    <div class="nv-modal" style="max-width:560px;">
      <form id="form-xe">
        <div class="nv-modal__header">
          <div class="nv-modal__header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="11" rx="2.5"/><path d="M3 11h18M7 16v3M17 16v3"/>
            </svg>
          </div>
          <h2 id="modal-tieu-de">Thêm xe</h2>
        </div>
        <div class="nv-modal__body">
          <input type="hidden" id="xe_id" />

          <div class="nv-form-row">
            <div>
              <label class="nv-label" for="bien_so">Biển số</label>
              <input class="input-field" type="text" id="bien_so" placeholder="VD 29B-123.45" maxlength="20" required />
            </div>
            <div>
              <label class="nv-label" for="loai_xe_id">Loại xe</label>
              <select class="input-field" id="loai_xe_id" required></select>
            </div>
          </div>

          <div class="nv-form-row">
            <div>
              <label class="nv-label" for="diem_goc_id">Điểm gốc (văn phòng)</label>
              <select class="input-field" id="diem_goc_id" required></select>
            </div>
            <div>
              <label class="nv-label" for="tuyen_id">Tuyến cố định</label>
              <select class="input-field" id="tuyen_id"></select>
            </div>
          </div>

          <label class="nv-label" for="trang_thai">Trạng thái</label>
          <select class="input-field" id="trang_thai">
            <option value="hoat_dong">Hoạt động</option>
            <option value="bao_tri">Bảo trì</option>
            <option value="ngung_su_dung">Ngừng sử dụng</option>
          </select>

          <div id="loi-form" class="text-error" hidden></div>
          <div class="nv-modal__actions">
            <button type="button" class="nv-btn-secondary" id="btn-huy">Hủy</button>
            <button type="submit" class="btn-primary">Lưu</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/nhan-vien/quan-ly/api-client.js"></script>
  <script src="/nhan-vien/quan-ly/auth-check.js"></script>
  <script src="/nhan-vien/quan-ly/nav.js"></script>
  <script src="/nhan-vien/quan-ly/tai-khoan.js"></script>
  <script src="/nhan-vien/quan-ly/thong-bao.js"></script>
  <script src="/nhan-vien/quan-ly/bien-che-modal.js"></script>
  <script>
    const nguoiDung = yeuCauVaiTro("quan_ly", "quan_ly_nhan_su");
    if (nguoiDung) {
      renderSidebar(document.getElementById("nv-sidebar"), "/nhan-vien/quan-ly/xe.html");
    }

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const NHAN_TRANG_THAI = {
      hoat_dong: { nhan: "Hoạt động", lop: "pill--gia-vinh-vien" },
      bao_tri: { nhan: "Bảo trì", lop: "pill--gia-thoi-han" },
      ngung_su_dung: { nhan: "Ngừng sử dụng", lop: "pill--xam" },
    };
    const SO_TAI_XE_YEU_CAU = 2;

    const boDau = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

    let boLocTrangThai = TrangThaiTrang.doc().trangThai || "tat_ca"; // tat_ca | hoat_dong | bao_tri | ngung_su_dung | thieu_nhan_su
    let dsXe = [];
    let dsLoaiXe = [];
    let dsVanPhong = [];
    let dsTuyen = [];

    const bangXe = document.getElementById("bang-xe");

    // ---------- Danh sách xe ----------
    // Biên chế: chấm đặc = đã có người ĐANG HOẠT ĐỘNG (người tạm nghỉ / đã nghỉ việc không tính). Chưa đủ thì xe chưa gán được chuyến;
    // xe dự phòng chưa đủ người thì chỉ ghi chú (không cảnh báo đỏ vì nhân sự của xe dự phòng được bố trí theo từng lúc).
    function htmlBienChe(xe) {
      const du = xe.du_nhan_su;
      const duPhong = !xe.tuyen_id;
      const chamTaiXe = Array.from({ length: SO_TAI_XE_YEU_CAU }, (_, i) => `<i class="${i < xe.so_tai_xe_hieu_luc ? "on" : ""}"></i>`).join("");
      const chamPhuXe = xe.so_phu_xe_hieu_luc ? Array.from({ length: xe.so_phu_xe_hieu_luc }, () => '<i class="on"></i>').join("") : "<i></i>";
      const lop = du ? "xe-bc--du" : duPhong ? "xe-bc--du-phong" : "xe-bc--thieu";
      const ketQua = du ? "Đủ nhân sự" : duPhong ? "Chưa đủ · xe dự phòng" : "Chưa đủ — chưa gán chuyến được";
      return `
        <div class="xe-bc ${lop}" title="${du ? "" : esc("Xe " + xe.thieu_nhan_su + ". ")}Cần 2 tài xế và ít nhất 1 phụ xe đang hoạt động mới gán được chuyến">
          <span class="xe-bc__nhom"><span class="xe-bc__nhan">Tài xế</span><span class="xe-bc__cham">${chamTaiXe}</span></span>
          <span class="xe-bc__nhom"><span class="xe-bc__nhan">Phụ xe</span><span class="xe-bc__cham">${chamPhuXe}</span></span>
          <span class="xe-bc__kq">${ketQua}</span>
        </div>`;
    }

    // Dải cảnh báo đầu danh sách: xe cố định tuyến, đang hoạt động mà chưa đủ nhân sự (xe dự phòng không tính)
    function renderCanhBaoNhanSu() {
      const o = document.getElementById("xe-canh-bao-nhan-su");
      const thieu = dsXe.filter((x) => x.can_canh_bao_nhan_su);
      o.hidden = !thieu.length;
      if (!thieu.length) {
        o.innerHTML = "";
        return;
      }
      o.innerHTML = `
        <span class="xe-canh-bao__noi-dung"><strong>${thieu.length} xe chạy tuyến cố định chưa đủ nhân sự</strong> — các xe này chưa gán được chuyến cho tới khi bổ sung biên chế (2 tài xế + ít nhất 1 phụ xe). Xe dự phòng không tính.</span>
        <button type="button" class="nv-btn-secondary xe-canh-bao__nut" id="xe-canh-bao-xem">Xem các xe này</button>`;
      document.getElementById("xe-canh-bao-xem").addEventListener("click", () => {
        boLocTrangThai = "thieu_nhan_su";
        renderDanhSach();
      });
    }

    async function taiDanhSach() {
      try {
        dsXe = await apiGet("/quan-ly/xe");
        document.getElementById("stat-so-luong").textContent = dsXe.length;
        renderDanhSach();
      } catch (err) {
        bangXe.innerHTML = `<div class="text-error">${esc(err.message)}</div>`;
      }
    }

    function renderChips() {
      const dem = { tat_ca: dsXe.length, hoat_dong: 0, bao_tri: 0, ngung_su_dung: 0 };
      dsXe.forEach((x) => dem[x.trang_thai]++);
      dem.thieu_nhan_su = dsXe.filter((x) => x.can_canh_bao_nhan_su).length;
      const cacChip = [["tat_ca", "Tất cả"], ["hoat_dong", "Hoạt động"], ["bao_tri", "Bảo trì"], ["ngung_su_dung", "Ngừng"], ["thieu_nhan_su", "Thiếu nhân sự"]];
      const o = document.getElementById("xe-chips");
      o.innerHTML = cacChip
        .map(([gt, nhan]) => `<button type="button" class="dd-chip${boLocTrangThai === gt ? " is-active" : ""}${gt === "thieu_nhan_su" && dem[gt] ? " dd-chip--canh-bao" : ""}" data-tt="${gt}">${nhan} <span>${dem[gt]}</span></button>`)
        .join("");
      o.querySelectorAll("[data-tt]").forEach((b) =>
        b.addEventListener("click", () => {
          boLocTrangThai = b.dataset.tt;
          renderDanhSach();
        })
      );
    }

    function renderDanhSach() {
      renderChips();
      renderCanhBaoNhanSu();
      const tk = boDau(document.getElementById("xe-tim").value.trim());
      const locLoai = document.getElementById("xe-loc-loai").value;
      const locTuyen = document.getElementById("xe-loc-tuyen").value; // "" | "__du_phong" | tuyen_id
      TrangThaiTrang.luu({ tim: document.getElementById("xe-tim").value, loai: locLoai, tuyen: locTuyen, trangThai: boLocTrangThai });

      const loc = dsXe.filter((x) => {
        if (boLocTrangThai === "thieu_nhan_su") {
          if (!x.can_canh_bao_nhan_su) return false;
        } else if (boLocTrangThai !== "tat_ca" && x.trang_thai !== boLocTrangThai) return false;
        if (locLoai && x.loai_xe_id !== locLoai) return false;
        if (locTuyen === "__du_phong" ? x.tuyen_id : locTuyen && x.tuyen_id !== locTuyen) return false;
        if (!tk) return true;
        return boDau(`${x.bien_so} ${x.ma_loai_xe} ${x.ten_loai_xe} ${x.ma_tuyen || ""} ${x.ten_tuyen || ""} ${x.ten_diem_goc}`).includes(tk);
      });

      if (!dsXe.length) {
        bangXe.innerHTML = '<div class="kv-trong">Chưa có xe nào — bấm "+ Thêm xe" để tạo xe đầu tiên.</div>';
        return;
      }
      if (!loc.length) {
        bangXe.innerHTML = '<div class="kv-trong">Không có xe nào khớp bộ lọc hiện tại.</div>';
        return;
      }

      loc.sort((a, b) => a.bien_so.localeCompare(b.bien_so, "vi"));
      bangXe.innerHTML = `<div class="xe-luoi">${loc
        .map((x) => {
          const tt = NHAN_TRANG_THAI[x.trang_thai];
          return `
            <article class="xe-the xe-the--${x.trang_thai}${x.can_canh_bao_nhan_su ? " xe-the--thieu-nhan-su" : ""}">
              <div class="xe-the__dau">
                <span class="xe-bien-so">${esc(x.bien_so)}</span>
                <span class="pill pill--nho ${tt.lop}">${tt.nhan}</span>
              </div>
              <div class="xe-the__than">
                <div class="xe-dong"><span class="xe-dong__nhan">Loại xe</span><span class="xe-dong__gt">${htmlMa(esc(x.ma_loai_xe))} ${esc(x.ten_loai_xe)}</span></div>
                <div class="xe-dong"><span class="xe-dong__nhan">Điểm gốc</span><span class="xe-dong__gt">${esc(x.ten_diem_goc)}</span></div>
                <div class="xe-dong"><span class="xe-dong__nhan">Tuyến</span><span class="xe-dong__gt">${
                  x.tuyen_id ? `<span class="pill pill--nho pill--nhom-tuyen">${esc(x.ma_tuyen)} · ${esc(x.ten_tuyen)}</span>` : '<span class="pill pill--nho pill--xam">Xe dự phòng</span>'
                }</span></div>
                ${htmlBienChe(x)}
              </div>
              <div class="xe-the__chan">
                <button type="button" class="nv-btn-phu" data-act="bien-che" data-id="${x.id}">Biên chế</button>
                <button type="button" class="nv-btn-sua" data-act="sua" data-id="${x.id}">Sửa</button>
                <button type="button" class="nv-btn-xoa" data-act="xoa" data-id="${x.id}">Xóa</button>
              </div>
            </article>`;
        })
        .join("")}</div>`;

      bangXe.querySelectorAll("[data-act]").forEach((btn) => {
        const x = dsXe.find((v) => v.id === btn.dataset.id);
        btn.addEventListener("click", () => {
          if (btn.dataset.act === "bien-che") moModalBienChe(x);
          else if (btn.dataset.act === "sua") moModalSua(x);
          else if (confirm(`Xóa xe "${x.bien_so}"? Không thể hoàn tác.`)) xoaXe(x);
        });
      });
    }

    document.getElementById("xe-tim").value = TrangThaiTrang.doc().tim || "";
    ["xe-tim"].forEach((id) => document.getElementById(id).addEventListener("input", renderDanhSach));
    ["xe-loc-loai", "xe-loc-tuyen"].forEach((id) => document.getElementById(id).addEventListener("change", renderDanhSach));

    async function xoaXe(xe) {
      try {
        await apiDelete(`/quan-ly/xe/${xe.id}`);
        taiDanhSach();
      } catch (err) {
        alert(err.message);
      }
    }

    // ---------- Nạp danh mục cho các ô chọn ----------
    async function naploadDauVao() {
      const [loaiXe, diem, tuyen] = await Promise.all([
        apiGet("/quan-ly/loai-xe"),
        apiGet("/quan-ly/diem-don-tra"),
        apiGet("/quan-ly/tuyen"),
      ]);
      dsLoaiXe = loaiXe;
      dsVanPhong = diem.filter((d) => d.loai === "van_phong");
      dsTuyen = tuyen;

      document.getElementById("loai_xe_id").innerHTML = dsLoaiXe.length
        ? dsLoaiXe.map((l) => `<option value="${l.id}">${esc(l.ma)} · ${esc(l.ten)}</option>`).join("")
        : '<option value="">Chưa có loại xe — tạo ở mục Loại xe trước</option>';
      document.getElementById("diem_goc_id").innerHTML = dsVanPhong.length
        ? dsVanPhong.map((d) => `<option value="${d.id}">${esc(d.ma)} · ${esc(d.ten)}</option>`).join("")
        : '<option value="">Chưa có văn phòng — tạo ở mục Điểm đón/trả trước</option>';
      document.getElementById("xe-loc-loai").innerHTML =
        '<option value="">Tất cả loại xe</option>' + dsLoaiXe.map((l) => `<option value="${l.id}">${esc(l.ma)} · ${esc(l.ten)}</option>`).join("");
      document.getElementById("xe-loc-tuyen").innerHTML =
        '<option value="">Tất cả tuyến</option><option value="__du_phong">Xe dự phòng</option>' +
        dsTuyen.map((t) => `<option value="${t.id}">${esc(t.ma)} · ${esc(t.ten)}</option>`).join("");
      document.getElementById("tuyen_id").innerHTML =
        '<option value="">— Xe dự phòng (chạy mọi tuyến) —</option>' + dsTuyen.map((t) => `<option value="${t.id}">${esc(t.ma)} · ${esc(t.ten)}</option>`).join("");
      // Khôi phục bộ lọc đã nhớ (option vừa nạp xong)
      const ttXe = TrangThaiTrang.doc();
      TrangThaiTrang.chonLaiSelect(document.getElementById("xe-loc-loai"), ttXe.loai);
      TrangThaiTrang.chonLaiSelect(document.getElementById("xe-loc-tuyen"), ttXe.tuyen);
    }

    (async () => {
      try {
        await naploadDauVao();
        await taiDanhSach();
      } catch (err) {
        bangXe.innerHTML = `<div class="text-error">${esc(err.message)}</div>`;
      }
    })();

    // ---------- Modal thêm/sửa xe ----------
    const modalOverlay = document.getElementById("modal-overlay");
    const form = document.getElementById("form-xe");
    const loiForm = document.getElementById("loi-form");

    document.getElementById("btn-them").addEventListener("click", () => {
      if (!dsLoaiXe.length || !dsVanPhong.length) {
        alert("Cần có ít nhất 1 loại xe và 1 điểm văn phòng trước khi thêm xe (mục Loại xe, Điểm đón/trả).");
        return;
      }
      document.getElementById("modal-tieu-de").textContent = "Thêm xe";
      form.reset();
      document.getElementById("xe_id").value = "";
      loiForm.hidden = true;
      modalOverlay.hidden = false;
    });

    function moModalSua(xe) {
      document.getElementById("modal-tieu-de").textContent = "Sửa xe";
      document.getElementById("xe_id").value = xe.id;
      document.getElementById("bien_so").value = xe.bien_so;
      document.getElementById("loai_xe_id").value = xe.loai_xe_id;
      document.getElementById("diem_goc_id").value = xe.diem_goc_id;
      document.getElementById("tuyen_id").value = xe.tuyen_id || "";
      document.getElementById("trang_thai").value = xe.trang_thai;
      loiForm.hidden = true;
      modalOverlay.hidden = false;
    }

    document.getElementById("btn-huy").addEventListener("click", () => { modalOverlay.hidden = true; });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      loiForm.hidden = true;

      const id = document.getElementById("xe_id").value;
      const payload = {
        bien_so: document.getElementById("bien_so").value.trim(),
        loai_xe_id: document.getElementById("loai_xe_id").value,
        diem_goc_id: document.getElementById("diem_goc_id").value,
        tuyen_id: document.getElementById("tuyen_id").value || null,
        trang_thai: document.getElementById("trang_thai").value,
      };

      const btn = form.querySelector("button[type=submit]");
      btn.classList.add("is-loading");
      try {
        if (id) await apiPut(`/quan-ly/xe/${id}`, payload);
        else await apiPost("/quan-ly/xe", payload);
        modalOverlay.hidden = true;
        taiDanhSach();
      } catch (err) {
        loiForm.textContent = err.message;
        loiForm.hidden = false;
      } finally {
        btn.classList.remove("is-loading");
      }
    });

    // ---------- Biên chế (UC-35): hộp riêng ở bien-che-modal.js ----------
    function moModalBienChe(xe) {
      BienCheModal.mo(xe, { khiDong: taiDanhSach }); // đóng hộp thì nạp lại danh sách để cập nhật số người và cảnh báo
    }
  </script>
</body>
</html>
