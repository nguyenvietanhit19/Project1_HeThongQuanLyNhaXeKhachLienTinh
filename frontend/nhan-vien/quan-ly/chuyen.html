<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/shared/assets/favicon.png" />
<title>Chuyến — Quản lý</title>
<link rel="stylesheet" href="/shared/design-tokens.css" />
<link rel="stylesheet" href="/nhan-vien/quan-ly/style.css" />
</head>
<body class="nhan-vien-shell">
  <div class="nv-layout">
    <aside class="nv-sidebar" id="nv-sidebar"></aside>

    <div class="nv-main">
      <header class="nv-topbar">
        <h1>Chuyến</h1>
        <div class="nv-topbar__user">
          <div class="nv-topbar__avatar" id="topbar-avatar"></div>
          <div class="nv-topbar__identity">
            <span class="ho-ten" id="topbar-ho-ten"></span>
            <span class="nv-topbar__role" id="topbar-vai-tro"></span>
          </div>
          <button class="nv-btn-secondary" id="btn-dang-xuat" type="button">Đăng xuất</button>
        </div>
      </header>

      <main class="nv-content">
        <div class="nv-page-intro">
          <div class="nv-page-intro__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12h18M3 12l4-5M3 12l4 5M21 12l-4-5M21 12l-4 5"/>
            </svg>
          </div>
          <div class="nv-page-intro__body">
            <p class="nv-page-intro__title">Chuyến</p>
            <p class="nv-page-intro__desc">Toàn bộ chuyến đã sinh từ các lịch chạy — lọc theo tuyến/chiều/ngày/trạng thái, bấm vào 1 chuyến để xem chi tiết. Chỉ sửa/xóa được chuyến chưa gán xe, chưa khởi hành và chưa có khách đặt vé.</p>
          </div>
          <div class="nv-page-intro__stat">
            <span class="nv-page-intro__stat-num" id="stat-so-luong">—</span>
            <span class="nv-page-intro__stat-label">chuyến</span>
          </div>
        </div>

        <div class="kv-thanh-cong cyn-loc">
          <div class="kv-tim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="loc-ma" placeholder="Tìm theo mã chuyến, VD T001-LX001..." autocomplete="off" />
          </div>
          <select class="input-field tb-select" id="loc-tuyen" aria-label="Lọc theo tuyến"><option value="">Tất cả tuyến</option></select>
          <div class="dd-chips" id="loc-chieu-chips"></div>
          <select class="input-field tb-select" id="loc-trang-thai" aria-label="Lọc theo trạng thái">
            <option value="">Mọi trạng thái</option>
            <option value="chua_khoi_hanh">Chưa khởi hành</option>
            <option value="dang_chay">Đang chạy</option>
            <option value="gap_su_co">Gặp sự cố</option>
            <option value="hoan_thanh">Hoàn thành</option>
            <option value="da_huy">Đã hủy</option>
          </select>
          <label class="tb-date"><span>Từ</span><input type="date" id="loc-tu-ngay" /></label>
          <label class="tb-date"><span>Đến</span><input type="date" id="loc-den-ngay" /></label>
          <button type="button" class="nv-btn-secondary cyn-xoa-loc" id="loc-btn-xoa">Xóa lọc</button>
        </div>

        <div class="gv-thong-ke cyn-thong-ke" id="cy-thong-ke"></div>

        <div id="cy-ds">Đang tải...</div>
      </main>
    </div>
  </div>

  <script src="/nhan-vien/quan-ly/api-client.js"></script>
  <script src="/nhan-vien/quan-ly/auth-check.js"></script>
  <script src="/nhan-vien/quan-ly/nav.js"></script>
  <script src="/nhan-vien/quan-ly/chuyen-chi-tiet.js"></script>
  <script>
    const nguoiDung = yeuCauVaiTro("quan_ly", "quan_ly_nhan_su");
    if (nguoiDung) {
      renderSidebar(document.getElementById("nv-sidebar"), "/nhan-vien/quan-ly/chuyen.html");
      renderTopbarUser();
    }
    document.getElementById("btn-dang-xuat").addEventListener("click", dangXuat);

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const pad2 = (n) => String(n).padStart(2, "0");

    const TEN_THU_DAY_DU = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
    const { NHAN_TRANG_THAI, pillTrangThai, mauTrangThai } = ChuyenChiTiet;

    const cyDs = document.getElementById("cy-ds");
    let dsTuyen = [];
    let dsChuyenDaTai = [];
    let boLocChieu = ""; // "" | xuoi | nguoc  (gửi lên API)
    let boLocNhanh = ""; // "" | chua_khoi_hanh | chua_gan_xe | dang | xong  (lọc nhanh phía client, bấm ở các ô thống kê)

    // Các nhóm ở thanh thống kê. "Chưa gán xe" = chuyến còn chờ điều độ viên gán xe.
    const NHOM_NHANH = {
      chua_khoi_hanh: (c) => c.trang_thai === "chua_khoi_hanh",
      chua_gan_xe: (c) => c.trang_thai === "chua_khoi_hanh" && !c.xe_id,
      dang: (c) => c.trang_thai === "dang_chay" || c.trang_thai === "gap_su_co",
      xong: (c) => c.trang_thai === "hoan_thanh" || c.trang_thai === "da_huy",
    };

    // ---------- Nạp danh mục cho ô lọc tuyến ----------
    async function naploadDauVao() {
      dsTuyen = await apiGet("/quan-ly/tuyen");
      const selectTuyen = document.getElementById("loc-tuyen");
      selectTuyen.innerHTML =
        '<option value="">Tất cả tuyến</option>' + dsTuyen.map((t) => `<option value="${t.id}">${esc(t.ma)} · ${esc(t.ten)}</option>`).join("");
    }

    function renderChipChieu() {
      const o = document.getElementById("loc-chieu-chips");
      o.innerHTML = [["", "Cả 2 chiều"], ["xuoi", "Xuôi"], ["nguoc", "Ngược"]]
        .map(([gt, nhan]) => `<button type="button" class="dd-chip${boLocChieu === gt ? " is-active" : ""}" data-chieu="${gt}">${nhan}</button>`)
        .join("");
      o.querySelectorAll("[data-chieu]").forEach((b) =>
        b.addEventListener("click", () => {
          boLocChieu = b.dataset.chieu;
          renderChipChieu();
          taiDanhSach();
        })
      );
    }

    // ---------- Đọc bộ lọc hiện tại, gọi API, render ----------
    function locHienTai() {
      const tuyenId = document.getElementById("loc-tuyen").value;
      const tuNgay = document.getElementById("loc-tu-ngay").value;
      const denNgay = document.getElementById("loc-den-ngay").value;
      const trangThai = document.getElementById("loc-trang-thai").value;

      const query = new URLSearchParams();
      if (tuyenId) query.set("tuyen_id", tuyenId);
      if (boLocChieu) query.set("chieu", boLocChieu);
      if (tuNgay) query.set("tu_ngay", tuNgay);
      if (denNgay) query.set("den_ngay", denNgay);
      if (trangThai) query.set("trang_thai", trangThai);
      return query.toString();
    }

    function renderThongKe(ds) {
      const dem = { tat_ca: ds.length };
      Object.keys(NHOM_NHANH).forEach((k) => (dem[k] = ds.filter(NHOM_NHANH[k]).length));
      const cacO = [
        { loc: "", nhan: "Tất cả chuyến", so: dem.tat_ca, mau: "#5B3E96" },
        { loc: "chua_khoi_hanh", nhan: "Chưa khởi hành", so: dem.chua_khoi_hanh, mau: "#16A34A" },
        { loc: "chua_gan_xe", nhan: "Chờ gán xe", so: dem.chua_gan_xe, mau: "#D97706" },
        { loc: "dang", nhan: "Đang chạy / sự cố", so: dem.dang, mau: "#DC2626" },
        { loc: "xong", nhan: "Hoàn thành / hủy", so: dem.xong, mau: "#6B7280" },
      ];
      const box = document.getElementById("cy-thong-ke");
      box.innerHTML = cacO
        .map(
          (o) => `
            <button type="button" class="gv-stat${boLocNhanh === o.loc ? " is-active" : ""}" data-nhanh="${o.loc}" style="--mau:${o.mau}">
              <span class="gv-stat__so">${o.so}</span>
              <span class="gv-stat__nhan">${o.nhan}</span>
            </button>`
        )
        .join("");
      box.querySelectorAll("[data-nhanh]").forEach((btn) =>
        btn.addEventListener("click", () => {
          boLocNhanh = boLocNhanh === btn.dataset.nhanh ? "" : btn.dataset.nhanh;
          hienThiDanhSach();
        })
      );
    }

    // Lọc theo mã chuyến + nhóm nhanh ở phía client trên danh sách đã tải (các bộ lọc còn lại gọi API).
    function hienThiDanhSach() {
      const tk = document.getElementById("loc-ma").value.trim().toLowerCase();
      const theoMa = tk ? dsChuyenDaTai.filter((c) => c.ma.toLowerCase().includes(tk)) : dsChuyenDaTai;
      renderThongKe(theoMa);
      const ds = boLocNhanh ? theoMa.filter(NHOM_NHANH[boLocNhanh]) : theoMa;
      document.getElementById("stat-so-luong").textContent = ds.length;
      renderDanhSach(ds);
    }
    document.getElementById("loc-ma").addEventListener("input", hienThiDanhSach);

    async function taiDanhSach() {
      cyDs.innerHTML = '<div class="kv-trong">Đang tải...</div>';
      try {
        dsChuyenDaTai = await apiGet(`/quan-ly/chuyen${locHienTai() ? "?" + locHienTai() : ""}`);
        hienThiDanhSach();
      } catch (err) {
        cyDs.innerHTML = `<div class="text-error">${esc(err.message)}</div>`;
      }
    }

    document.querySelectorAll("#loc-tuyen, #loc-tu-ngay, #loc-den-ngay, #loc-trang-thai").forEach((el) => {
      el.addEventListener("change", taiDanhSach);
    });

    document.getElementById("loc-btn-xoa").addEventListener("click", () => {
      document.getElementById("loc-ma").value = "";
      document.getElementById("loc-tuyen").value = "";
      document.getElementById("loc-tu-ngay").value = "";
      document.getElementById("loc-den-ngay").value = "";
      document.getElementById("loc-trang-thai").value = "";
      boLocChieu = "";
      boLocNhanh = "";
      renderChipChieu();
      taiDanhSach();
    });

    // ---------- Danh sách, nhóm theo ngày ----------
    function nhomTheoNgay(ds) {
      const nhom = new Map(); // "YYYY-M-D" -> [chuyến...], giữ đúng thứ tự API trả về (đã ORDER BY giờ)
      ds.forEach((c) => {
        const d = new Date(c.gio_khoi_hanh);
        const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        if (!nhom.has(key)) nhom.set(key, []);
        nhom.get(key).push(c);
      });
      return nhom;
    }

    function tieuDeNgay(ngayKey, list) {
      const [y, m, d] = ngayKey.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      const homNay = new Date();
      homNay.setHours(0, 0, 0, 0);
      const chenh = Math.round((dt - homNay) / 86400000);
      const nhanPhu = chenh === 0 ? "Hôm nay" : chenh === 1 ? "Ngày mai" : chenh === -1 ? "Hôm qua" : "";
      const chuaGan = list.filter(NHOM_NHANH.chua_gan_xe).length;
      return `
        <div class="cyn-ngay__dau${chenh === 0 ? " cyn-ngay__dau--nay" : ""}${chenh < 0 ? " cyn-ngay__dau--qua" : ""}">
          <span class="cyn-ngay__so"><b>${pad2(d)}</b><small>Th${m}</small></span>
          <span class="cyn-ngay__ten"><strong>${TEN_THU_DAY_DU[dt.getDay()]}</strong><span>${nhanPhu ? nhanPhu + " · " : ""}${pad2(d)}/${pad2(m)}/${y}</span></span>
          <span class="cyn-ngay__dem">${list.length} chuyến</span>
          ${chuaGan ? `<span class="pill pill--nho pill--gia-thoi-han">${chuaGan} chờ gán xe</span>` : ""}
        </div>`;
    }

    function theChuyen(c) {
      const d = new Date(c.gio_khoi_hanh);
      const gio = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      return `
        <button type="button" class="cyn-the" data-id="${c.id}" style="--mau:${mauTrangThai(c.trang_thai)}">
          <span class="cyn-the__gio"><b>${gio}</b><small>${NHAN_TRANG_THAI[c.trang_thai] || c.trang_thai}</small></span>
          <span class="cyn-the__chinh">
            <span class="cyn-the__tuyen">${esc(c.ten_tuyen)}</span>
            <span class="cyn-the__phu">
              ${htmlMa(esc(c.ma))}
              <span class="pill pill--nho ${c.chieu === "xuoi" ? "pill--khu-vuc" : "pill--gia-thoi-han"}">${c.chieu === "xuoi" ? "Xuôi" : "Ngược"}</span>
              <span class="cyn-the__loai">${esc(c.ma_loai_xe)} · ${esc(c.ten_loai_xe)}</span>
            </span>
          </span>
          <span class="cyn-the__xe">${c.bien_so_xe ? `<span class="xe-bien-so cyn-bien-so">${esc(c.bien_so_xe)}</span>` : '<span class="cyn-chua-gan">Chưa gán xe</span>'}</span>
          <span class="cyn-the__ve${c.so_ve_dang_hoat_dong ? " co-ve" : ""}">${c.so_ve_dang_hoat_dong ? `<b>${c.so_ve_dang_hoat_dong}</b> vé` : "Chưa có vé"}</span>
        </button>`;
    }

    function renderDanhSach(ds) {
      if (!ds.length) {
        cyDs.innerHTML = '<div class="kv-trong">Không có chuyến nào khớp bộ lọc.</div>';
        return;
      }

      cyDs.innerHTML = [...nhomTheoNgay(ds).entries()]
        .map(
          ([ngayKey, list]) => `
            <section class="cyn-ngay">
              ${tieuDeNgay(ngayKey, list)}
              <div class="cyn-ngay__ds">${list.map(theChuyen).join("")}</div>
            </section>`
        )
        .join("");

      cyDs.querySelectorAll("[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => moModalChiTiet(btn.dataset.id));
      });
    }

    renderChipChieu();

    (async () => {
      try {
        await naploadDauVao();
        await taiDanhSach();
      } catch (err) {
        cyDs.innerHTML = `<div class="text-error">${esc(err.message)}</div>`;
      }
    })();

    // ---------- Modal chi tiết + sửa/xóa (dùng chung với trang Lịch chạy) ----------
    const moModalChiTiet = (chuyenId) => ChuyenChiTiet.mo(chuyenId, { onThayDoi: taiDanhSach });
  </script>
</body>
</html>
