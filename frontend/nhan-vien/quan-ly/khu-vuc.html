<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/shared/assets/favicon.png" />
<title>Khu vực — Quản lý</title>
<link rel="stylesheet" href="/shared/design-tokens.css" />
<link rel="stylesheet" href="/nhan-vien/quan-ly/style.css" />
</head>
<body class="nhan-vien-shell">
  <div class="nv-layout">
    <aside class="nv-sidebar" id="nv-sidebar"></aside>

    <div class="nv-main">
      <header class="nv-topbar">
        <h1>Khu vực</h1>
        <div class="nv-topbar__user">
          <div class="nv-topbar__avatar" id="topbar-avatar"></div>
          <div class="nv-topbar__identity">
            <span class="ho-ten" id="topbar-ho-ten"></span>
            <span class="nv-topbar__role" id="topbar-vai-tro"></span>
          </div>
          <button class="nv-btn-secondary" id="btn-dang-xuat" type="button">Đăng xuất</button>
        </div>
      </header>

      <main class="nv-content">
        <div class="nv-page-intro">
          <div class="nv-page-intro__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2Z"/><path d="M9 3v16M15 5v16"/>
            </svg>
          </div>
          <div class="nv-page-intro__body">
            <p class="nv-page-intro__title">Khu vực</p>
            <p class="nv-page-intro__desc">Gộp các điểm đón/trả gần nhau theo tỉnh/thành — dùng để khách tìm kiếm chuyến theo điểm đi/điểm đến.</p>
          </div>
          <div class="nv-page-intro__stat">
            <span class="nv-page-intro__stat-num" id="stat-so-luong">—</span>
            <span class="nv-page-intro__stat-label">khu vực</span>
          </div>
        </div>

        <div class="kv-thanh-cong">
          <div class="kv-tim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="kv-tim" placeholder="Tìm theo tên, mã khu vực hoặc tỉnh/thành..." autocomplete="off" />
          </div>
          <span class="kv-tom-tat" id="kv-tom-tat"></span>
          <button class="btn-primary nv-btn-them" id="btn-them" type="button">+ Thêm khu vực</button>
        </div>
        <div id="bang-khu-vuc">Đang tải...</div>
      </main>
    </div>
  </div>

  <div class="nv-modal-overlay" id="modal-overlay" hidden>
    <div class="nv-modal">
      <form id="form-khu-vuc">
        <div class="nv-modal__header">
          <div class="nv-modal__header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2Z"/><path d="M9 3v16M15 5v16"/>
            </svg>
          </div>
          <h2 id="modal-tieu-de">Thêm khu vực</h2>
        </div>
        <div class="nv-modal__body">
          <input type="hidden" id="khu_vuc_id" />

          <div class="nv-form-row">
            <div>
              <label class="nv-label" for="ten">Tên khu vực</label>
              <input class="input-field" type="text" id="ten" placeholder='VD "Lào Cai (TP, Bến Đền...)"' required />
            </div>
            <div>
              <label class="nv-label" for="tinh_thanh">Tỉnh/thành</label>
              <input class="input-field" type="text" id="tinh_thanh" placeholder="Gõ để tìm — 1 trong 34 tỉnh/thành" required />
            </div>
          </div>

          <div id="loi-form" class="text-error" hidden></div>
          <div class="nv-modal__actions">
            <button type="button" class="nv-btn-secondary" id="btn-huy">Hủy</button>
            <button type="submit" class="btn-primary">Lưu</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/nhan-vien/quan-ly/api-client.js"></script>
  <script src="/nhan-vien/quan-ly/auth-check.js"></script>
  <script src="/nhan-vien/quan-ly/nav.js"></script>
  <script src="/nhan-vien/quan-ly/tinh-thanh.js"></script>
  <script>
    const nguoiDung = yeuCauVaiTro("quan_ly", "quan_ly_nhan_su");
    if (nguoiDung) {
      renderSidebar(document.getElementById("nv-sidebar"), "/nhan-vien/quan-ly/khu-vuc.html");
      renderTopbarUser();
    }
    document.getElementById("btn-dang-xuat").addEventListener("click", dangXuat);

    const oTinhThanh = document.getElementById("tinh_thanh");
    kemTimKiemTinhThanh(oTinhThanh);

    const bangKhuVuc = document.getElementById("bang-khu-vuc");
    const oTim = document.getElementById("kv-tim");
    let dsKhuVuc = [];
    let soDiemTheoKhuVuc = new Map(); // khu_vuc_id -> số điểm đón/trả

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const boDau = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

    // Mỗi tỉnh/thành 1 màu cố định (băm từ tên) để nhìn nhóm nào ra nhóm đó
    const BANG_MAU = [
      ["#5B3E96", "#EEE9F7"], // tím
      ["#D98C1A", "#FDF1DC"], // cam
      ["#0F9B8E", "#DDF4F1"], // ngọc
      ["#D6336C", "#FBE4EC"], // hồng
      ["#2563EB", "#E0EAFE"], // dương
      ["#2F9E44", "#E1F5E6"], // lá
    ];
    function mauTheoTinh(ten) {
      let h = 0;
      for (const ch of ten) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return BANG_MAU[h % BANG_MAU.length];
    }

    async function taiDanhSach() {
      try {
        const [dsKv, dsDiem] = await Promise.all([apiGet("/quan-ly/khu-vuc"), apiGet("/quan-ly/diem-don-tra")]);
        dsKhuVuc = dsKv;
        soDiemTheoKhuVuc = new Map();
        dsDiem.forEach((d) => soDiemTheoKhuVuc.set(d.khu_vuc_id, (soDiemTheoKhuVuc.get(d.khu_vuc_id) || 0) + 1));
        document.getElementById("stat-so-luong").textContent = dsKhuVuc.length;
        renderDanhSach();
      } catch (err) {
        bangKhuVuc.innerHTML = `<div class="text-error">${esc(err.message)}</div>`;
      }
    }

    function renderDanhSach() {
      const tk = boDau(oTim.value.trim());
      const loc = tk ? dsKhuVuc.filter((k) => boDau(`${k.ten} ${k.ma} ${k.tinh_thanh}`).includes(tk)) : dsKhuVuc;

      const nhom = new Map();
      loc.forEach((k) => {
        if (!nhom.has(k.tinh_thanh)) nhom.set(k.tinh_thanh, []);
        nhom.get(k.tinh_thanh).push(k);
      });
      const cacTinh = [...nhom.keys()].sort((a, b) => a.localeCompare(b, "vi"));

      document.getElementById("kv-tom-tat").textContent = dsKhuVuc.length
        ? `${loc.length} khu vực · ${cacTinh.length} tỉnh/thành`
        : "";

      if (!dsKhuVuc.length) {
        bangKhuVuc.innerHTML = '<div class="kv-trong">Chưa có khu vực nào — bấm "+ Thêm khu vực" để tạo khu vực đầu tiên.</div>';
        return;
      }
      if (!loc.length) {
        bangKhuVuc.innerHTML = '<div class="kv-trong">Không có khu vực nào khớp từ khóa tìm kiếm.</div>';
        return;
      }

      bangKhuVuc.innerHTML = `<div class="kv-luoi">${cacTinh
        .map((tinh) => {
          const [dam, nhat] = mauTheoTinh(tinh);
          const ds = nhom.get(tinh).sort((a, b) => a.ten.localeCompare(b.ten, "vi"));
          return `
            <section class="kv-nhom" style="--c:${dam}; --c-nhat:${nhat}">
              <header class="kv-nhom__dau">
                <span class="kv-nhom__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
                </span>
                <h3>${esc(tinh)}</h3>
                <span class="kv-nhom__dem">${ds.length} khu vực</span>
              </header>
              <ul class="kv-nhom__ds">
                ${ds
                  .map((k) => {
                    const soDiem = soDiemTheoKhuVuc.get(k.id) || 0;
                    return `
                    <li class="kv-item">
                      <div class="kv-item__chinh">
                        <strong class="kv-item__ten">${esc(k.ten)}</strong>
                        <span class="kv-item__phu">
                          ${htmlMa(esc(k.ma))}
                          <span class="kv-diem ${soDiem ? "" : "kv-diem--0"}">${soDiem ? soDiem + " điểm đón/trả" : "Chưa có điểm"}</span>
                        </span>
                      </div>
                      <div class="kv-item__nut">
                        <button type="button" class="nv-btn-sua" data-act="sua" data-id="${k.id}">Sửa</button>
                        <button type="button" class="nv-btn-xoa" data-act="xoa" data-id="${k.id}">Xóa</button>
                      </div>
                    </li>`;
                  })
                  .join("")}
              </ul>
            </section>`;
        })
        .join("")}</div>`;

      bangKhuVuc.querySelectorAll("[data-act]").forEach((btn) => {
        const kv = dsKhuVuc.find((k) => k.id === btn.dataset.id);
        btn.addEventListener("click", () => {
          if (btn.dataset.act === "sua") moModalSua(kv);
          else if (confirm(`Xóa khu vực "${kv.ten}"? Không thể hoàn tác.`)) xoaKhuVuc(kv);
        });
      });
    }

    oTim.addEventListener("input", renderDanhSach);
    taiDanhSach();

    async function xoaKhuVuc(khuVuc) {
      try {
        await apiDelete(`/quan-ly/khu-vuc/${khuVuc.id}`);
        taiDanhSach();
      } catch (err) {
        alert(err.message);
      }
    }

    const modalOverlay = document.getElementById("modal-overlay");
    const form = document.getElementById("form-khu-vuc");
    const loiForm = document.getElementById("loi-form");

    function moModal() {
      loiForm.hidden = true;
      modalOverlay.hidden = false;
    }

    function moModalThem() {
      document.getElementById("modal-tieu-de").textContent = "Thêm khu vực";
      form.reset();
      document.getElementById("khu_vuc_id").value = "";
      moModal();
    }

    function moModalSua(khuVuc) {
      document.getElementById("modal-tieu-de").textContent = "Sửa khu vực";
      document.getElementById("khu_vuc_id").value = khuVuc.id;
      document.getElementById("ten").value = khuVuc.ten;
      oTinhThanh.value = khuVuc.tinh_thanh;
      moModal();
    }

    document.getElementById("btn-them").addEventListener("click", moModalThem);
    document.getElementById("btn-huy").addEventListener("click", () => { modalOverlay.hidden = true; });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      loiForm.hidden = true;

      const ten = document.getElementById("ten").value.trim();
      const tinhThanh = oTinhThanh.value.trim();

      if (!laTinhThanhHopLe(tinhThanh)) {
        loiForm.textContent = 'Tỉnh/thành không hợp lệ — vui lòng chọn đúng 1 giá trị trong danh sách gợi ý.';
        loiForm.hidden = false;
        oTinhThanh.focus();
        return;
      }

      const id = document.getElementById("khu_vuc_id").value;
      const duLieu = { ten, tinh_thanh: tinhThanh };

      const btnSubmit = form.querySelector("button[type=submit]");
      btnSubmit.classList.add("is-loading");
      try {
        if (id) {
          await apiPut(`/quan-ly/khu-vuc/${id}`, duLieu);
        } else {
          await apiPost("/quan-ly/khu-vuc", duLieu);
        }
        modalOverlay.hidden = true;
        taiDanhSach();
      } catch (err) {
        loiForm.textContent = err.message;
        loiForm.hidden = false;
      } finally {
        btnSubmit.classList.remove("is-loading");
      }
    });
  </script>
</body>
</html>
