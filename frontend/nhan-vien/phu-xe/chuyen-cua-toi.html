<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Chuyến của tôi — Phụ xe</title>
<link rel="stylesheet" href="/shared/design-tokens.css?v=2" />
<link rel="stylesheet" href="phu-xe.css?v=14" />
</head>
<body class="phu-xe-page">
  <div class="app-shell">
  <div class="topbar">
    <div>
      <h1>Chuyến của tôi</h1>
      <p class="topbar-sub" id="loi-chao">Xin chào</p>
    </div>
    <div class="topbar-actions">
      <button class="btn-icon-circle btn-icon-circle--dark" onclick="taiDanhSach()" title="Tải lại" aria-label="Tải lại">↻</button>
    </div>
  </div>

  <div class="container container--pull-up">
    <div class="card">
      <div id="danh-sach-chuyen" class="trip-list">
        <p class="empty-state">Đang tải...</p>
      </div>
    </div>
  </div>
  </div>

  <script src="/shared/api-client.js"></script>
  <script src="../shared/auth-check.js"></script>
  <script src="tai-khoan-menu.js?v=2"></script>
  <script>
    const { hoTen } = requireRole("phu_xe");
    document.getElementById("loi-chao").textContent = `Xin chào, ${hoTen}`;

    function esc(giaTri) {
      return String(giaTri ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const NHAN_TRANG_THAI = {
      chua_khoi_hanh: "Chưa khởi hành",
      dang_chay: "Đang chạy",
      gap_su_co: "Đang gặp sự cố",
    };

    // Nhãn + màu theo pha thật của chuyến (đang dừng / đang di chuyển / bến mở...) thay cho "Đang chạy" chung chung
    function nhanChuyen(c) {
      if (c.trang_thai === "dang_chay") return c.dang_di_chuyen ? ["Đang di chuyển", "pill--success"] : ["Xe đang dừng", "pill--success"];
      if (c.trang_thai === "gap_su_co") return ["Đang gặp sự cố", "pill--dark"];
      if (c.trang_thai === "chua_khoi_hanh") {
        const bay = Date.now();
        if (bay >= new Date(c.gio_khoi_hanh).getTime()) return ["Đến giờ chạy", "pill--primary"];
        if (bay >= new Date(c.gio_mo_ben).getTime()) return ["Bến đã mở", "pill--primary"];
      }
      return [NHAN_TRANG_THAI[c.trang_thai] || c.trang_thai, "pill--primary"];
    }

    function dinhDangGio(iso) {
      const d = new Date(iso);
      return d.toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    async function taiDanhSach() {
      const el = document.getElementById("danh-sach-chuyen");
      try {
        const chuyenList = await apiGet("/phu-xe/chuyen-cua-toi");
        if (chuyenList.length === 0) {
          el.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">Hiện không có chuyến nào đang/sắp chạy thuộc xe bạn phụ trách.</p>';
          return;
        }

        el.innerHTML = chuyenList
          .map(
            (c) => `
          <a class="trip-card" href="chuyen-dang-chay.html?chuyen_id=${encodeURIComponent(c.id)}">
            <div class="trip-route">${esc(c.tuyen_ten)}</div>
            <div class="trip-meta">
              <span>${esc(c.bien_so)}</span> · ${dinhDangGio(c.gio_khoi_hanh)} ·
              <span class="pill ${nhanChuyen(c)[1]}">${esc(nhanChuyen(c)[0])}</span>
              ${c.dang_hoan ? '<span class="pill pill--dark">Đang hoãn</span>' : ""}
            </div>
          </a>`
          )
          .join("");
      } catch (err) {
        el.innerHTML = `<p class="text-error">${esc(err.message)}</p>`;
      }
    }

    taiDanhSach();
  </script>
</body>
</html>
