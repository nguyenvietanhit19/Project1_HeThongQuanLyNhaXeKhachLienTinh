<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Chuyến đang chạy — Phụ xe</title>
<link rel="stylesheet" href="/shared/design-tokens.css?v=2" />
<link rel="stylesheet" href="phu-xe.css?v=3" />
</head>
<body class="phu-xe-page">
  <div class="app-shell">
  <div class="topbar">
    <div>
      <a class="back-link" href="chuyen-cua-toi.html">← Chuyến của tôi</a>
      <h1 id="tieu-de-tuyen">Đang tải...</h1>
      <p class="topbar-sub" id="tieu-de-meta"></p>
    </div>
    <div class="topbar-actions">
      <button class="btn-icon-circle btn-icon-circle--dark" id="nut-tai-lai" onclick="taiLai()" title="Tải lại" aria-label="Tải lại">↻</button>
      <button class="btn-icon-circle btn-icon-circle--dark" onclick="dangXuat()" title="Đăng xuất" aria-label="Đăng xuất">⏻</button>
    </div>
  </div>

  <div class="container container--pull-up">
    <div id="banner-vung"></div>

    <div class="trip-layout">
      <!-- Cột trái: điều khiển chuyến (xuất phát, hành trình, sự cố) -->
      <div class="cot-trai">
        <!-- UC-15: xuất phát -->
        <div class="card" id="khu-xuat-phat" hidden>
          <button class="btn-primary" id="nut-xuat-phat" onclick="hanhDong(() => xacNhanXuatPhat(), this)">Xác nhận xe đã xuất phát</button>
          <p class="hint" id="goi-y-xuat-phat" hidden></p>
        </div>

        <!-- UC-16: hành trình -->
        <div class="card section" id="khu-hanh-trinh" hidden>
          <h2>Hành trình</h2>
          <div id="danh-sach-hanh-trinh"></div>
        </div>

        <!-- UC-17: báo sự cố -->
        <div class="section sticky-action" id="khu-bao-su-co" hidden>
          <button class="btn-danger-outline" onclick="moModalSuCo()">⚠ Báo xe gặp sự cố dọc đường</button>
        </div>
      </div>

      <!-- Cột phải: khách và hàng tại điểm hiện tại -->
      <div class="cot-phai">
        <div class="card section" id="khu-tim-kiem" hidden>
          <div class="search-box" style="position:static;padding:0;">
            <input class="input-field" type="search" id="o-tim-kiem" inputmode="search" autocomplete="off"
                   placeholder="Tìm ghế, tên, SĐT, mã..." aria-label="Tìm khách hoặc hàng" />
          </div>
        </div>

        <!-- UC-12: khách cần lên -->
        <div class="card section" id="khu-khach-len" hidden>
          <h2>Khách cần lên tại đây</h2>
          <div id="danh-sach-khach-len"></div>
        </div>

        <!-- UC-13: khách cần xuống -->
        <div class="card section" id="khu-khach-xuong" hidden>
          <h2>Khách cần xuống tại đây</h2>
          <div id="danh-sach-khach-xuong"></div>
        </div>

        <!-- UC-26: hàng cần chất -->
        <div class="card section" id="khu-hang-chat" hidden>
          <h2>Hàng cần chất tại đây</h2>
          <div id="danh-sach-hang-chat"></div>
        </div>

        <!-- UC-27: hàng cần dỡ -->
        <div class="card section" id="khu-hang-do" hidden>
          <h2>Hàng cần dỡ tại đây</h2>
          <div id="danh-sach-hang-do"></div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>

  <!-- Modal báo sự cố — cố ý đặt ngoài .app-shell: overlay position:fixed
       nên phủ toàn màn hình. Điện thoại: bottom sheet; tablet: hộp thoại giữa. -->
  <div class="modal-overlay" id="modal-su-co" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="tieu-de-su-co">
      <h2 id="tieu-de-su-co">Báo sự cố giữa đường</h2>
      <form id="form-su-co">
        <select class="input-field" id="loai_su_co" required>
          <option value="">— Chọn nguyên nhân —</option>
          <option value="loi_nha_xe">Lỗi nhà xe (hỏng xe, thủng lốp, tai nạn do nhà xe)</option>
          <option value="loi_khach_quan">Khách quan (thiên tai, sạt lở, sự cố ngoại cảnh)</option>
        </select>
        <textarea class="input-field" id="ly_do" placeholder="Mô tả sự cố (theo lời tài xế)" required></textarea>
        <div id="loi-su-co" class="text-error" hidden></div>
        <button class="btn-primary" type="submit">Gửi báo cáo cho điều độ viên</button>
        <button class="btn-confirm btn-confirm--outline btn-confirm--block" type="button" onclick="dongModalSuCo()">Hủy</button>
      </form>
    </div>
  </div>

  <script src="/shared/api-client.js"></script>
  <script src="../shared/auth-check.js"></script>
  <script>
    requireRole("phu_xe");

    const thamSo = new URLSearchParams(window.location.search);
    const chuyenId = thamSo.get("chuyen_id");
    if (!chuyenId) {
      window.location.href = "chuyen-cua-toi.html";
    }

    // Dữ liệu từ server (tên khách, tên điểm...) là chuỗi người dùng nhập — luôn
    // escape trước khi chèn vào innerHTML để không chạy được script chèn lậu.
    function esc(giaTri) {
      return String(giaTri ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function dinhDangGio(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function elHien(id, hien) {
      document.getElementById(id).hidden = !hien;
    }

    // Bỏ dấu + chữ thường để ô tìm kiếm khớp "nguyen" với "Nguyễn"
    function chuanHoa(s) {
      return String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
    }

    let timerToast = null;
    function hienLoi(thongDiep) {
      const el = document.getElementById("toast");
      el.textContent = thongDiep;
      el.hidden = false;
      clearTimeout(timerToast);
      timerToast = setTimeout(() => (el.hidden = true), 5000);
    }

    let dangXuLy = false;

    // Bọc mọi hành động ghi (bấm nút): khóa nút trong lúc gửi để bấm đúp không gửi
    // 2 lần, báo lỗi nghiệp vụ bằng thông báo nổi (không chặn màn hình như alert()),
    // rồi luôn tải lại toàn bộ dữ liệu sau khi xong.
    async function hanhDong(thucHien, nut) {
      if (dangXuLy) return;
      dangXuLy = true;
      if (nut) nut.disabled = true;
      try {
        await thucHien();
      } catch (err) {
        hienLoi(err.message);
      } finally {
        dangXuLy = false;
        try {
          await taiDuLieu();
        } catch (err) {
          hienLoi(err.message);
        }
        if (nut && document.body.contains(nut)) nut.disabled = false;
      }
    }

    function taiLai() {
      const nut = document.getElementById("nut-tai-lai");
      nut.disabled = true;
      taiDuLieu()
        .catch((err) => hienLoi(err.message))
        .finally(() => (nut.disabled = false));
    }

    function xacNhanXuatPhat() {
      return apiPost(`/phu-xe/chuyen/${chuyenId}/xuat-phat`, {});
    }

    function xacNhanToiDiem(diemId) {
      return apiPost(`/phu-xe/chuyen/${chuyenId}/toi-diem`, { diem_don_tra_id: diemId });
    }

    function lenXe(veId) {
      return apiPost(`/phu-xe/chuyen/${chuyenId}/ve/${veId}/len-xe`, {});
    }

    function xuongXe(veId) {
      return apiPost(`/phu-xe/chuyen/${chuyenId}/ve/${veId}/xuong-xe`, {});
    }

    function chatHang(donHangId) {
      return apiPost(`/phu-xe/don-hang/${donHangId}/chat-len-xe`, { chuyen_id: chuyenId });
    }

    function doHang(donHangId) {
      return apiPost(`/phu-xe/don-hang/${donHangId}/do-hang`, {});
    }

    function moModalSuCo() {
      elHien("modal-su-co", true);
    }

    function dongModalSuCo() {
      elHien("modal-su-co", false);
      document.getElementById("form-su-co").reset();
      document.getElementById("loi-su-co").hidden = true;
    }

    document.getElementById("form-su-co").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi-su-co");
      const nutGui = e.submitter;
      loiEl.hidden = true;
      if (nutGui) nutGui.disabled = true;
      try {
        await apiPost(`/phu-xe/chuyen/${chuyenId}/bao-su-co`, {
          loai_su_co: document.getElementById("loai_su_co").value,
          ly_do: document.getElementById("ly_do").value.trim(),
        });
        dongModalSuCo();
        await taiDuLieu();
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
      } finally {
        if (nutGui) nutGui.disabled = false;
      }
    });

    function baoThatLac(nut) {
      const { id, ma } = nut.dataset;
      window.location.href = `bao-that-lac.html?don_hang_id=${encodeURIComponent(id)}&ma_van_don=${encodeURIComponent(ma)}&chuyen_id=${encodeURIComponent(chuyenId)}`;
    }

    function renderNguoi(danhSach, nutChu, onBam) {
      if (danhSach.length === 0) {
        return '<p class="empty-state">Không có ai.</p>';
      }
      return danhSach
        .map(
          (v) => `
        <div class="list-item" data-tim="${esc(chuanHoa([v.so_ghe, v.ho_ten, v.so_dien_thoai, v.ma_dat_cho].join(" ")))}">
          <div class="info">
            <div class="name"><span class="seat-code">${esc(v.so_ghe)}</span>${esc(v.ho_ten)}</div>
            <div class="sub">${esc(v.so_dien_thoai)} · Mã đặt chỗ ${esc(v.ma_dat_cho)}</div>
          </div>
          <button class="btn-confirm" onclick="hanhDong(() => ${onBam}('${esc(v.ve_id)}'), this)">${nutChu}</button>
        </div>`
        )
        .join("");
    }

    function renderHangChat(danhSach) {
      if (danhSach.length === 0) {
        return '<p class="empty-state">Không có đơn hàng nào chờ chất.</p>';
      }
      return danhSach
        .map(
          (d) => `
        <div class="list-item" data-tim="${esc(chuanHoa([d.ma_van_don, d.ten_nguoi_nhan, d.ten_diem_nhan].join(" ")))}">
          <div class="info">
            <div class="name">${esc(d.ma_van_don)} — ${esc(d.ten_nguoi_nhan)}</div>
            <div class="sub">${esc(d.can_nang_kg)}kg · đến ${esc(d.ten_diem_nhan)}</div>
            <a href="#" class="text-link item-link" data-id="${esc(d.id)}" data-ma="${esc(d.ma_van_don)}" onclick="baoThatLac(this); return false;">Báo hư hỏng</a>
          </div>
          <button class="btn-confirm" onclick="hanhDong(() => chatHang('${esc(d.id)}'), this)">Chất lên xe</button>
        </div>`
        )
        .join("");
    }

    function renderHangDo(danhSach) {
      if (danhSach.length === 0) {
        return '<p class="empty-state">Không có đơn hàng nào chờ dỡ.</p>';
      }
      return danhSach
        .map(
          (d) => `
        <div class="list-item" data-tim="${esc(chuanHoa([d.ma_van_don, d.ten_nguoi_nhan].join(" ")))}">
          <div class="info">
            <div class="name">${esc(d.ma_van_don)} — ${esc(d.ten_nguoi_nhan)}</div>
            <div class="sub">${esc(d.can_nang_kg)}kg</div>
            <a href="#" class="text-link item-link" data-id="${esc(d.id)}" data-ma="${esc(d.ma_van_don)}" onclick="baoThatLac(this); return false;">Báo thất lạc/hư hỏng</a>
          </div>
          <button class="btn-confirm" onclick="hanhDong(() => doHang('${esc(d.id)}'), this)">Dỡ hàng</button>
        </div>`
        )
        .join("");
    }

    function renderHanhTrinh(diemList, dangChay) {
      // Điểm kế tiếp cần xác nhận = điểm chưa "đã tới" đầu tiên (bỏ qua
      // điểm đầu tuyến — đó là nơi xuất phát, không có nút riêng ở đây).
      const diemKeTiep = diemList.slice(1).find((d) => !d.da_toi);

      return diemList
        .map((d, i) => {
          const laHienTai = dangChay && diemKeTiep && d.diem_don_tra_id === diemKeTiep.diem_don_tra_id;
          const cssClass = d.da_toi ? "da-toi" : laHienTai ? "hien-tai" : "";
          const laCuoi = i === diemList.length - 1;
          return `
          <div class="route-step ${cssClass}">
            <div class="dot-col">
              <div class="dot"></div>
              ${!laCuoi ? '<div class="line"></div>' : ""}
            </div>
            <div class="noi-dung">
              <div class="ten-diem">${esc(d.ten_diem)}</div>
              <div class="gio">${d.da_toi ? "Đã đến lúc " + dinhDangGio(d.gio_thuc_te) : i === 0 ? "Điểm xuất phát" : "Chưa đến"}</div>
              ${laHienTai ? `<button class="btn-confirm" onclick="hanhDong(() => xacNhanToiDiem('${esc(d.diem_don_tra_id)}'), this)">Xác nhận đã đến đây</button>` : ""}
            </div>
          </div>`;
        })
        .join("");
    }

    // Lọc danh sách khách/hàng theo ô tìm kiếm; chạy lại sau mỗi lần render để
    // giữ nguyên từ khóa khi dữ liệu tự làm mới.
    function apDungTimKiem() {
      const tuKhoa = chuanHoa(document.getElementById("o-tim-kiem").value.trim());
      document.querySelectorAll(".cot-phai .list-item[data-tim]").forEach((dong) => {
        dong.hidden = tuKhoa !== "" && !dong.dataset.tim.includes(tuKhoa);
      });
      document.querySelectorAll(".cot-phai .card[id^='khu-'] > div[id^='danh-sach-']").forEach((vung) => {
        const cu = vung.querySelector(".khong-ket-qua");
        if (cu) cu.remove();
        const coDong = vung.querySelectorAll(".list-item[data-tim]").length > 0;
        const hienDuoc = vung.querySelectorAll(".list-item[data-tim]:not([hidden])").length > 0;
        if (tuKhoa !== "" && coDong && !hienDuoc) {
          vung.insertAdjacentHTML("beforeend", '<p class="empty-state khong-ket-qua">Không có kết quả khớp.</p>');
        }
      });
    }
    document.getElementById("o-tim-kiem").addEventListener("input", apDungTimKiem);

    // UC-15: chỉ xác nhận xuất phát đúng giờ hoặc muộn hơn. Server là nơi chặn thật
    // (kể cả khi đồng hồ điện thoại sai) — đây chỉ là gợi ý để phụ xe khỏi bấm vô ích.
    let gioKhoiHanhHienTai = null;
    function capNhatNutXuatPhat() {
      const nut = document.getElementById("nut-xuat-phat");
      const goiY = document.getElementById("goi-y-xuat-phat");
      if (!gioKhoiHanhHienTai) return;
      const conSom = Date.now() < new Date(gioKhoiHanhHienTai).getTime();
      nut.disabled = conSom || dangXuLy;
      goiY.hidden = !conSom;
      if (conSom) {
        goiY.textContent = `Chưa đến giờ khởi hành — chỉ xác nhận được từ ${new Date(gioKhoiHanhHienTai).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}.`;
      }
    }
    setInterval(capNhatNutXuatPhat, 15000);

    async function taiDuLieu() {
      const bannerEl = document.getElementById("banner-vung");
      bannerEl.innerHTML = "";

      let chuyen;
      try {
        // Không dùng danh sách "chuyến của tôi" để lấy header nữa — danh
        // sách đó CHỦ Ý bỏ qua chuyến đã hoan_thanh, nhưng phụ xe vẫn cần
        // xử lý nốt khách xuống/hàng dỡ ngay tại điểm cuối sau khi chuyến
        // vừa chuyển hoan_thanh (mục 8.2 điểm 4/8/9).
        chuyen = await apiGet(`/phu-xe/chuyen/${chuyenId}`);
      } catch (err) {
        document.getElementById("tieu-de-tuyen").textContent = "Không tìm thấy chuyến";
        document.getElementById("tieu-de-meta").textContent = "";
        ["khu-xuat-phat", "khu-hanh-trinh", "khu-tim-kiem", "khu-khach-len", "khu-khach-xuong", "khu-hang-chat", "khu-hang-do", "khu-bao-su-co"].forEach((id) =>
          elHien(id, false)
        );
        bannerEl.innerHTML = `<div class="card"><p class="text-error">${esc(err.message)}</p></div>`;
        return;
      }

      document.getElementById("tieu-de-tuyen").textContent = chuyen.tuyen_ten;
      document.getElementById("tieu-de-meta").textContent = `${chuyen.bien_so} · ${dinhDangGio(chuyen.gio_khoi_hanh)}`;

      if (chuyen.dang_hoan) {
        bannerEl.innerHTML += '<div class="status-banner status-banner--warning">Chuyến đang HOÃN — chờ điều độ viên tìm xe/xử lý.</div>';
      }

      const dangChay = chuyen.trang_thai === "dang_chay";
      const chuaKhoiHanh = chuyen.trang_thai === "chua_khoi_hanh";
      const gapSuCo = chuyen.trang_thai === "gap_su_co";
      const hoanThanh = chuyen.trang_thai === "hoan_thanh";

      if (gapSuCo) {
        bannerEl.innerHTML +=
          '<div class="status-banner status-banner--danger">Chuyến đang GẶP SỰ CỐ — điều độ viên đang xử lý, tạm dừng thao tác.</div>';
      }
      if (hoanThanh) {
        bannerEl.innerHTML +=
          '<div class="status-banner status-banner--warning">Xe đã đến điểm cuối — xử lý nốt khách xuống xe/hàng dỡ còn lại bên dưới nếu có.</div>';
      }

      elHien("khu-xuat-phat", chuaKhoiHanh);
      gioKhoiHanhHienTai = chuaKhoiHanh ? chuyen.gio_khoi_hanh : null;
      capNhatNutXuatPhat();
      elHien("khu-bao-su-co", dangChay);

      // Lên xe/chất hàng chỉ còn ý nghĩa TRƯỚC hoặc TRONG khi chạy — xuống
      // xe/dỡ hàng còn cần dùng được cả khi chuyến VỪA hoan_thanh, vì điểm
      // cuối cùng cũng là 1 điểm trả khách/trả hàng bình thường.
      const coTheLenVaChat = chuaKhoiHanh || dangChay;
      const coTheXuongVaDo = chuaKhoiHanh || dangChay || hoanThanh;

      elHien("khu-hanh-trinh", dangChay);
      if (dangChay) {
        const hanhTrinh = await apiGet(`/phu-xe/chuyen/${chuyenId}/hanh-trinh`);
        document.getElementById("danh-sach-hanh-trinh").innerHTML = renderHanhTrinh(hanhTrinh, dangChay);
      }

      elHien("khu-tim-kiem", coTheLenVaChat || coTheXuongVaDo);
      elHien("khu-khach-len", coTheLenVaChat);
      elHien("khu-hang-chat", coTheLenVaChat);
      elHien("khu-khach-xuong", coTheXuongVaDo);
      elHien("khu-hang-do", coTheXuongVaDo);

      if (coTheLenVaChat || coTheXuongVaDo) {
        const diem = await apiGet(`/phu-xe/chuyen/${chuyenId}/diem-hien-tai`);
        document.getElementById("khu-khach-len").querySelector("h2").textContent = `Khách cần lên tại ${diem.ten_diem} (${diem.khach_can_len.length})`;
        document.getElementById("khu-khach-xuong").querySelector("h2").textContent = `Khách cần xuống tại ${diem.ten_diem} (${diem.khach_can_xuong.length})`;
        if (coTheLenVaChat) {
          document.getElementById("danh-sach-khach-len").innerHTML = renderNguoi(diem.khach_can_len, "Lên xe", "lenXe");
        }
        if (coTheXuongVaDo) {
          document.getElementById("danh-sach-khach-xuong").innerHTML = renderNguoi(diem.khach_can_xuong, "Xuống xe", "xuongXe");
        }

        const [hangChat, hangDo] = await Promise.all([
          coTheLenVaChat ? apiGet(`/phu-xe/chuyen/${chuyenId}/hang-cho-chat`) : Promise.resolve([]),
          coTheXuongVaDo ? apiGet(`/phu-xe/chuyen/${chuyenId}/hang-cho-do`) : Promise.resolve([]),
        ]);
        document.getElementById("danh-sach-hang-chat").innerHTML = renderHangChat(hangChat);
        document.getElementById("danh-sach-hang-do").innerHTML = renderHangDo(hangDo);
        apDungTimKiem();
      }
    }

    taiDuLieu().catch((err) => {
      document.getElementById("banner-vung").innerHTML = `<div class="card"><p class="text-error">${esc(err.message)}</p></div>`;
    });

    // Danh sách khách do người khác (quầy vé) cập nhật liên tục — tự làm mới mỗi
    // 30 giây và khi quay lại tab/ứng dụng, trừ lúc đang thao tác hoặc mở hộp
    // thoại báo sự cố (tránh giật màn hình giữa chừng).
    function tuLamMoi() {
      if (dangXuLy || !document.getElementById("modal-su-co").hidden || document.visibilityState !== "visible") return;
      taiDuLieu().catch(() => {});
    }
    setInterval(tuLamMoi, 30000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") tuLamMoi();
    });
  </script>
</body>
</html>
