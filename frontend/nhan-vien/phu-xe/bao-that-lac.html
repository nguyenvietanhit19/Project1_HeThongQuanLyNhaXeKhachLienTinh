<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Báo thất lạc/hư hỏng — Phụ xe</title>
<link rel="stylesheet" href="/shared/design-tokens.css?v=2" />
<link rel="stylesheet" href="phu-xe.css?v=2" />
</head>
<body class="phu-xe-page">
  <div class="app-shell">
  <div class="topbar">
    <div>
      <a id="lien-ket-quay-lai" href="chuyen-cua-toi.html" style="color:inherit;text-decoration:none;font-size:13px;opacity:0.85;">← Quay lại chuyến</a>
      <h1>Báo thất lạc / hư hỏng hàng</h1>
    </div>
  </div>

  <div class="container container--pull-up">
    <div class="card">
      <p><strong>Mã vận đơn:</strong> <span id="ma-van-don"></span></p>

      <form id="form-bao-cao">
        <textarea class="input-field" id="mo_ta" placeholder="Mô tả tình trạng thất lạc/hư hỏng phát hiện được" required></textarea>
        <div id="loi" class="text-error" hidden></div>
        <div id="thanh-cong" class="text-success" hidden></div>
        <button class="btn-primary" type="submit">Gửi báo cáo</button>
      </form>
    </div>
  </div>
  </div>

  <script src="/shared/api-client.js"></script>
  <script src="../shared/auth-check.js"></script>
  <script>
    requireRole("phu_xe");

    const thamSo = new URLSearchParams(window.location.search);
    const donHangId = thamSo.get("don_hang_id");
    const maVanDon = thamSo.get("ma_van_don") || "";
    const chuyenId = thamSo.get("chuyen_id");

    if (!donHangId) {
      window.location.href = "chuyen-cua-toi.html";
    }

    document.getElementById("ma-van-don").textContent = maVanDon;
    if (chuyenId) {
      document.getElementById("lien-ket-quay-lai").href = `chuyen-dang-chay.html?chuyen_id=${chuyenId}`;
    }

    document.getElementById("form-bao-cao").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi");
      const thanhCongEl = document.getElementById("thanh-cong");
      loiEl.hidden = true;
      thanhCongEl.hidden = true;

      try {
        await apiPost(`/phu-xe/don-hang/${donHangId}/bao-that-lac`, {
          mo_ta: document.getElementById("mo_ta").value.trim(),
        });
        thanhCongEl.textContent = "Đã gửi báo cáo cho nhân viên gửi hàng và quản lý.";
        thanhCongEl.hidden = false;
        document.getElementById("form-bao-cao").reset();
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
      }
    });
  </script>
</body>
</html>
