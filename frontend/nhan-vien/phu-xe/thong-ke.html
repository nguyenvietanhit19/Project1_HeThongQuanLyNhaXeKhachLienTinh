<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Thống kê — Phụ xe</title>
<link rel="stylesheet" href="/shared/design-tokens.css?v=2" />
<link rel="stylesheet" href="phu-xe.css?v=10" />
<style>
  /* Lưới thẻ số liệu/ô ngày đã chuyển sang phu-xe.css (2 cột điện thoại, 4 cột tablet) */
</style>
</head>
<body class="phu-xe-page">
  <div class="app-shell">
  <div class="topbar">
    <div>
      <a class="back-link" href="chuyen-cua-toi.html">← Chuyến của tôi</a>
      <h1>Thống kê chuyến của tôi</h1>
    </div>
  </div>

  <div class="container container--pull-up">
    <div class="card">
      <form id="form-loc" class="date-row">
        <input class="input-field" type="date" id="tu_ngay" required />
        <input class="input-field" type="date" id="den_ngay" required />
        <button class="btn-primary" type="submit">Xem</button>
      </form>

      <div id="loi" class="text-error" hidden></div>

      <div class="stat-grid" id="ket-qua" hidden>
        <div class="stat-tile">
          <div class="so" id="so-chuyen">0</div>
          <div class="nhan">Số chuyến đã chạy</div>
        </div>
        <div class="stat-tile">
          <div class="so" id="doanh-thu">0đ</div>
          <div class="nhan">Doanh thu (vé đã bán)</div>
        </div>
        <div class="stat-tile">
          <div class="so" id="ty-le-lap-day">0%</div>
          <div class="nhan">Tỷ lệ lấp đầy ghế trung bình</div>
        </div>
        <div class="stat-tile">
          <div class="so" id="su-co-huy">0 / 0</div>
          <div class="nhan">Chuyến gặp sự cố / bị hủy</div>
        </div>
      </div>
    </div>

    <!-- Chi tiết từng chuyến trong khoảng ngày đã chọn — bấm 1 chuyến để xem khách, hàng, hành trình -->
    <div class="card trip-history" id="khu-chuyen-da-chay" hidden>
      <h2 class="trip-history__tieu-de">Chuyến đã chạy <span class="count-badge" id="dem-chuyen">0</span></h2>
      <div id="ds-chuyen-da-chay"></div>
    </div>
  </div>
  </div>

  <script src="/shared/api-client.js"></script>
  <script src="../shared/auth-check.js"></script>
  <script src="tai-khoan-menu.js?v=1"></script>
  <script>
    requireRole("phu_xe");

    // Ngày theo giờ máy (VN) — toISOString() trả ngày UTC nên 0h-7h sáng sẽ lùi 1 ngày.
    function dinhDangNgay(d) {
      const thang = String(d.getMonth() + 1).padStart(2, "0");
      const ngay = String(d.getDate()).padStart(2, "0");
      return `${d.getFullYear()}-${thang}-${ngay}`;
    }

    // Mặc định xem 30 ngày gần nhất — cho thao tác đầu tiên có kết quả ngay.
    const homNay = new Date();
    const ba0NgayTruoc = new Date(homNay);
    ba0NgayTruoc.setDate(homNay.getDate() - 30);
    document.getElementById("tu_ngay").value = dinhDangNgay(ba0NgayTruoc);
    document.getElementById("den_ngay").value = dinhDangNgay(homNay);

    async function taiThongKe() {
      const loiEl = document.getElementById("loi");
      const ketQuaEl = document.getElementById("ket-qua");
      loiEl.hidden = true;

      const tuNgay = document.getElementById("tu_ngay").value;
      const denNgay = document.getElementById("den_ngay").value;

      try {
        const tk = await apiGet(`/phu-xe/thong-ke?tu_ngay=${tuNgay}&den_ngay=${denNgay}`);
        document.getElementById("so-chuyen").textContent = tk.so_chuyen;
        document.getElementById("doanh-thu").textContent = tk.doanh_thu.toLocaleString("vi-VN") + "đ";
        document.getElementById("ty-le-lap-day").textContent = Math.round(tk.ty_le_lap_day_trung_binh * 100) + "%";
        document.getElementById("su-co-huy").textContent = `${tk.so_chuyen_su_co} / ${tk.so_chuyen_huy}`;
        ketQuaEl.hidden = false;

        const dsChuyen = await apiGet(`/phu-xe/chuyen-da-chay?tu_ngay=${tuNgay}&den_ngay=${denNgay}`);
        veChuyenDaChay(dsChuyen);
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
        ketQuaEl.hidden = true;
        document.getElementById("khu-chuyen-da-chay").hidden = true;
      }
    }

    function esc(giaTri) {
      return String(giaTri ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const NHAN_CHUYEN = {
      dang_chay: ["Đang chạy", "badge--tren"],
      hoan_thanh: ["Hoàn thành", "badge--xong"],
      gap_su_co: ["Gặp sự cố", "badge--loi"],
      da_huy: ["Đã hủy", "badge--loi"],
    };

    // Mỗi chuyến 1 dòng gọn (tuyến, giờ, số vé, doanh thu); bấm vào mở trang tổng quan của chuyến đó.
    function veChuyenDaChay(ds) {
      document.getElementById("khu-chuyen-da-chay").hidden = false;
      document.getElementById("dem-chuyen").textContent = ds.length;
      document.getElementById("ds-chuyen-da-chay").innerHTML = ds.length
        ? ds.map((c) => {
            const [nhan, lop] = NHAN_CHUYEN[c.trang_thai] || [c.trang_thai, ""];
            const gio = new Date(c.gio_khoi_hanh).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
            return `
              <a class="row-btn" href="chi-tiet-chuyen.html?chuyen_id=${encodeURIComponent(c.id)}&ve=thong-ke" style="text-decoration:none;">
                <span class="row-btn__chinh">
                  <span class="name">${esc(c.tuyen_ten)} · ${c.chieu === "nguoc" ? "chiều ngược" : "chiều xuôi"}</span>
                  <span class="sub">${esc(gio)} · ${c.so_ve_ban}${c.tong_ghe ? "/" + c.tong_ghe : ""} vé · ${Number(c.doanh_thu).toLocaleString("vi-VN")}đ · ${c.so_don_hang} đơn hàng</span>
                </span>
                <span class="badge ${lop}">${esc(nhan)}</span>
              </a>`;
          }).join("")
        : '<p class="empty-state">Không có chuyến nào trong khoảng ngày này.</p>';
    }

    document.getElementById("form-loc").addEventListener("submit", (e) => {
      e.preventDefault();
      taiThongKe();
    });

    taiThongKe();

    // Tự tải lại định kỳ (30 giây) — số liệu đổi khi phụ xe hoàn thành
    // chuyến ở màn hình khác (chuyen-dang-chay.html) rồi quay lại đây,
    // không có cách nào để trang này biết ngay lập tức nếu không polling.
    setInterval(taiThongKe, 30000);

    // Tải lại ngay khi quay lại tab này (ví dụ vừa hoàn thành 1 chuyến ở
    // tab/màn hình khác rồi bấm quay lại) — không cần đợi tới lượt poll kế tiếp.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        taiThongKe();
      }
    });
  </script>
</body>
</html>
