<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập nhân viên — Nhà xe khách</title>
<link rel="stylesheet" href="/shared/design-tokens.css?v=2" />
<style>
  /* .auth-page/.auth-card từng nằm ở design-tokens.css, đã được chuyển
     riêng sang frontend/khach-hang/auth.css (chỉ dành cho nhóm trang
     khách hàng, xem THIET_KE_UI.md mục 4/comment đầu file đó) — nhân
     viên cần bản tương đương riêng, khai báo ngay tại đây vì chỉ 1 trang
     dùng, không đáng tách thêm 1 file CSS mới. */
  body.auth-page {
    background: var(--color-bg-canvas);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
  }
  .auth-card { max-width: 400px; width: 100%; }
  .auth-card h1 { font-size: 26px; margin-bottom: 4px; }
  .auth-card p.subtitle { color: var(--color-text-muted); margin-bottom: 20px; }
</style>
</head>
<body class="auth-page">
  <div class="card auth-card">
    <h1>Đăng nhập nhân viên</h1>
    <p class="subtitle">Dành cho phụ xe, nhân viên quầy vé, gửi hàng, điều độ, kế toán, quản lý</p>

    <form id="form-dang-nhap">
      <input class="input-field" type="email" id="email" placeholder="Email" required />
      <input class="input-field" type="password" id="mat_khau" placeholder="Mật khẩu" required />
      <div id="loi" class="text-error" hidden></div>
      <button class="btn-primary" type="submit">Đăng nhập</button>
    </form>
  </div>

  <script src="/shared/api-client.js"></script>
  <script>
    // Sau đăng nhập, mỗi vai trò có 1 khu vực giao diện riêng
    // (CONTRIBUTING.md mục 4) — chỉ phụ xe đã có giao diện, các vai trò
    // khác hiện báo "chưa sẵn sàng" thay vì lỗi trắng trang.
    const TRANG_THEO_VAI_TRO = {
      phu_xe: "phu-xe/chuyen-cua-toi.html",
    };

    document.getElementById("form-dang-nhap").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi");
      loiEl.hidden = true;

      try {
        const ketQua = await apiPost("/auth/dang-nhap", {
          email: document.getElementById("email").value.trim(),
          mat_khau: document.getElementById("mat_khau").value,
        });

        localStorage.setItem("token", ketQua.token);
        localStorage.setItem("vai_tro", ketQua.vai_tro);
        localStorage.setItem("ho_ten", ketQua.ho_ten);

        const trang = TRANG_THEO_VAI_TRO[ketQua.vai_tro];
        if (trang) {
          window.location.href = trang;
        } else {
          loiEl.textContent = `Giao diện cho vai trò "${ketQua.vai_tro}" chưa sẵn sàng.`;
          loiEl.hidden = false;
        }
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
      }
    });
  </script>
</body>
</html>
