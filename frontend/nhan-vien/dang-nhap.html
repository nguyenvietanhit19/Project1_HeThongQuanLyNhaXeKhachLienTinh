<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/shared/assets/favicon.png" />
<title>Đăng nhập cán bộ — GoBus</title>
<link rel="stylesheet" href="/shared/design-tokens.css" />
<link rel="stylesheet" href="/nhan-vien/dang-nhap.css" />
</head>
<body class="dncb-page">
  <div class="dncb-card">
    <picture>
      <source media="(max-width: 700px)" srcset="/shared/assets/dang-nhap-canbo-nen-mobile.png" />
      <img class="dncb-card__bg" src="/shared/assets/dang-nhap-canbo-nen.jpg" alt="" aria-hidden="true" />
    </picture>

    <div class="dncb-card__content">
      <img class="dncb-logo-lon" src="/shared/assets/logo-full.png" alt="GoBus — Kết nối mọi hành trình" />
      <h1 class="dncb-heading">Đăng nhập</h1>
      <p class="dncb-subtitle">Đăng nhập tài khoản cán bộ</p>

      <form id="form-dang-nhap">
        <label class="dncb-field-label" for="email">Email</label>
        <div class="dncb-input-icon-group">
          <svg class="dncb-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7.5 8 5.5 8-5.5"/>
          </svg>
          <input class="input-field" type="email" id="email" placeholder="ten@nhaxekhach.com" required />
        </div>

        <label class="dncb-field-label" for="mat_khau">Mật khẩu</label>
        <div class="dncb-input-icon-group">
          <svg class="dncb-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
          <input class="input-field" type="password" id="mat_khau" placeholder="••••••••" required />
        </div>

        <div id="loi" class="text-error" hidden></div>
        <div id="thanh-cong" class="text-success" hidden></div>

        <button class="btn-primary dncb-btn-dang-nhap" type="submit">Đăng nhập</button>
      </form>
    </div>
  </div>

  <script>
    // Trang đăng nhập chung cho mọi vai trò cán bộ — không phụ thuộc file
    // JS của riêng vai trò nào (mỗi vai trò tự viết CSS/JS trong thư mục
    // của họ, VD frontend/nhan-vien/quan-ly/), nên tự gọi API trực tiếp ở
    // đây thay vì import apiPost() từ chỗ khác.
    const API_BASE_URL = "http://localhost:8000";

    const VE_TRANG_SAU_DANG_NHAP = {
      quan_ly: "/nhan-vien/quan-ly/khu-vuc.html",
      quan_ly_nhan_su: "/nhan-vien/quan-ly/khu-vuc.html",
    };

    const btnSubmit = document.querySelector("#form-dang-nhap button[type=submit]");

    document.getElementById("form-dang-nhap").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi");
      const thanhCongEl = document.getElementById("thanh-cong");
      loiEl.hidden = true;
      thanhCongEl.hidden = true;
      btnSubmit.classList.add("is-loading");

      try {
        const res = await fetch(`${API_BASE_URL}/auth/dang-nhap`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            mat_khau: document.getElementById("mat_khau").value,
          }),
        });
        const ketQua = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(ketQua.loi || ketQua.detail || "Có lỗi xảy ra, thử lại sau");
        }

        // "Cán bộ" = mọi vai trò TRỪ khách hàng — không dùng whitelist theo
        // VE_TRANG_SAU_DANG_NHAP để xét quyền, vì vai trò cán bộ mới (chưa
        // có giao diện riêng) vẫn hợp lệ, chỉ là chưa có trang để chuyển tới.
        if (ketQua.vai_tro === "khach_hang") {
          // Email/mật khẩu đúng nhưng là tài khoản khách hàng — đây là
          // trang riêng cho cán bộ nên từ chối thẳng, KHÔNG lưu
          // token/vai_tro vào localStorage.
          throw new Error("Tài khoản này không có quyền truy cập trang cán bộ");
        }

        localStorage.setItem("token", ketQua.token);
        localStorage.setItem("vai_tro", ketQua.vai_tro);
        localStorage.setItem("ho_ten", ketQua.ho_ten);

        const trangDich = VE_TRANG_SAU_DANG_NHAP[ketQua.vai_tro];
        if (trangDich) {
          thanhCongEl.textContent = `Xin chào ${ketQua.ho_ten}! Đăng nhập thành công.`;
          thanhCongEl.hidden = false;
          setTimeout(() => { window.location.href = trangDich; }, 600);
        } else {
          thanhCongEl.textContent = `Đăng nhập thành công, nhưng giao diện cho vai trò "${ketQua.vai_tro}" chưa sẵn sàng — sẽ sớm được bổ sung.`;
          thanhCongEl.hidden = false;
          btnSubmit.classList.remove("is-loading");
        }
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
        btnSubmit.classList.remove("is-loading");
      }
    });
  </script>
</body>
</html>
