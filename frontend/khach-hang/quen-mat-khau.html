<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quên mật khẩu — Nhà xe khách</title>
<link rel="stylesheet" href="/shared/design-tokens.css" />
</head>
<body class="auth-page">
  <div class="card auth-card">
    <h1>Quên mật khẩu</h1>
    <p class="subtitle">Nhập email để nhận mã đặt lại mật khẩu</p>

    <!-- Bước 1: nhập email -->
    <form id="form-buoc-1">
      <input class="input-field" type="email" id="email" placeholder="Email" required />
      <div id="loi-buoc-1" class="text-error" hidden></div>
      <button class="btn-primary" type="submit">Gửi mã xác nhận</button>
    </form>

    <!-- Bước 2: nhập mã + mật khẩu mới -->
    <form id="form-buoc-2" hidden>
      <p>Nếu email tồn tại, mã xác nhận đã được gửi, có hiệu lực <strong>1 phút</strong>.</p>
      <input class="input-field" type="text" id="ma_xac_nhan" placeholder="Mã xác nhận (6 số)" required />
      <input class="input-field" type="password" id="mat_khau_moi" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" minlength="6" required />
      <div id="loi-buoc-2" class="text-error" hidden></div>
      <button class="btn-primary" type="submit">Đặt lại mật khẩu</button>
      <p style="text-align:center; margin-top:12px;">
        <a class="text-link" href="#" id="gui-lai-ma">Gửi lại mã</a>
      </p>
    </form>

    <p style="text-align:center; margin-top:20px;">
      <a class="text-link" href="dang-nhap.html">Quay lại đăng nhập</a>
    </p>
  </div>

  <script src="/shared/api-client.js"></script>
  <script>
    let emailDangXuLy = null;

    document.getElementById("form-buoc-1").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi-buoc-1");
      loiEl.hidden = true;

      emailDangXuLy = document.getElementById("email").value.trim();

      try {
        // Backend luôn trả về thành công dù email không tồn tại (chống dò quét — NGHIEP_VU.md mục 2.1)
        await apiPost("/auth/quen-mat-khau", { email: emailDangXuLy });
        document.getElementById("form-buoc-1").hidden = true;
        document.getElementById("form-buoc-2").hidden = false;
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
      }
    });

    document.getElementById("form-buoc-2").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi-buoc-2");
      loiEl.hidden = true;

      try {
        await apiPost("/auth/dat-lai-mat-khau", {
          email: emailDangXuLy,
          ma_xac_nhan: document.getElementById("ma_xac_nhan").value.trim(),
          mat_khau_moi: document.getElementById("mat_khau_moi").value,
        });
        alert("Đổi mật khẩu thành công, vui lòng đăng nhập lại.");
        window.location.href = "dang-nhap.html";
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
      }
    });

    document.getElementById("gui-lai-ma").addEventListener("click", async (e) => {
      e.preventDefault();
      try {
        await apiPost("/auth/quen-mat-khau", { email: emailDangXuLy });
        alert("Đã gửi lại mã xác nhận.");
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
