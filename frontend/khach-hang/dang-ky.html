<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng ký — Nhà xe khách</title>
<link rel="stylesheet" href="/shared/design-tokens.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-illustration">
      <div class="auth-illustration__art">
        <svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="170" cy="46" r="34" fill="var(--color-primary)" opacity="0.9"/>
          <circle cx="170" cy="46" r="34" fill="#fff" opacity="0.12"/>
          <ellipse cx="44" cy="38" rx="22" ry="10" fill="#fff" opacity="0.25"/>
          <ellipse cx="64" cy="32" rx="16" ry="8" fill="#fff" opacity="0.25"/>
          <line x1="0" y1="150" x2="220" y2="150" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>
          <line x1="10" y1="185" x2="40" y2="185" stroke="#fff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
          <line x1="60" y1="185" x2="90" y2="185" stroke="#fff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
          <line x1="110" y1="185" x2="140" y2="185" stroke="#fff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
          <line x1="160" y1="185" x2="190" y2="185" stroke="#fff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
          <rect x="28" y="96" width="140" height="66" rx="18" fill="#fff"/>
          <rect x="28" y="96" width="140" height="20" rx="10" fill="var(--color-primary)"/>
          <rect x="44" y="124" width="28" height="22" rx="6" fill="var(--color-secondary-dark)" opacity="0.55"/>
          <rect x="80" y="124" width="28" height="22" rx="6" fill="var(--color-secondary-dark)" opacity="0.55"/>
          <rect x="116" y="124" width="28" height="22" rx="6" fill="var(--color-secondary-dark)" opacity="0.55"/>
          <circle cx="60" cy="168" r="13" fill="#1A1A1E"/>
          <circle cx="60" cy="168" r="5" fill="#fff"/>
          <circle cx="136" cy="168" r="13" fill="#1A1A1E"/>
          <circle cx="136" cy="168" r="5" fill="#fff"/>
        </svg>
      </div>
      <div class="auth-illustration__badge" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="auth-illustration__text">
        <h2>Bắt đầu hành trình</h2>
        <p>Tạo tài khoản để đặt vé nhanh, nhận thông báo chuyến đi và lưu lại lịch sử vé của bạn.</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <h1>Tạo tài khoản</h1>
      <p class="subtitle">Nhập thông tin để bắt đầu đặt vé online</p>

      <!-- Bước 1: nhập thông tin, gửi mã xác nhận -->
      <form id="form-buoc-1">
        <input class="input-field" type="email" id="email" placeholder="Email" required />
        <input class="input-field" type="password" id="mat_khau" placeholder="Mật khẩu (tối thiểu 6 ký tự)" minlength="6" required />
        <input class="input-field" type="text" id="ho_ten" placeholder="Họ và tên" required />
        <input class="input-field" type="tel" id="so_dien_thoai" placeholder="Số điện thoại" required />
        <div id="loi-buoc-1" class="text-error" hidden></div>
        <button class="btn-primary" type="submit">Gửi mã xác nhận</button>
      </form>

      <!-- Bước 2: nhập mã OTP vừa gửi về email -->
      <form id="form-buoc-2" hidden>
        <p class="otp-hint">Mã xác nhận đã gửi tới <strong id="email-hien-thi"></strong>, có hiệu lực <strong>1 phút</strong>.</p>
        <div class="otp-group" id="otp-group">
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" />
          <input class="otp-box" type="text" inputmode="numeric" maxlength="1" />
        </div>
        <div id="loi-buoc-2" class="text-error" hidden></div>
        <button class="btn-primary" type="submit">Xác nhận & tạo tài khoản</button>
        <p class="otp-resend">
          Chưa nhận được mã? <a class="text-link" href="#" id="gui-lai-ma">Gửi lại mã</a>
        </p>
      </form>

      <p style="text-align:center; margin-top:20px;">
        Đã có tài khoản? <a class="text-link" href="dang-nhap.html">Đăng nhập</a>
      </p>
    </div>
  </div>

  <script src="/shared/api-client.js"></script>
  <script src="otp-input.js"></script>
  <script>
    let thongTinDangKy = null;
    const otp = initOtpInput(document.getElementById("otp-group"));
    const demNguoc = initOtpResendCountdown(document.getElementById("gui-lai-ma"), 60, guiMaXacNhan);

    async function guiMaXacNhan() {
      const loiEl = document.getElementById("loi-buoc-1");
      loiEl.hidden = true;
      try {
        await apiPost("/auth/gui-ma-dang-ky", thongTinDangKy);
        return true;
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
        return false;
      }
    }

    document.getElementById("form-buoc-1").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi-buoc-1");
      const btn = e.target.querySelector("button[type=submit]");
      loiEl.hidden = true;
      btn.classList.add("is-loading");

      thongTinDangKy = {
        email: document.getElementById("email").value.trim(),
        mat_khau: document.getElementById("mat_khau").value,
        ho_ten: document.getElementById("ho_ten").value.trim(),
        so_dien_thoai: document.getElementById("so_dien_thoai").value.trim(),
      };

      try {
        await apiPost("/auth/gui-ma-dang-ky", thongTinDangKy);
        document.getElementById("email-hien-thi").textContent = thongTinDangKy.email;
        document.getElementById("form-buoc-1").hidden = true;
        document.getElementById("form-buoc-2").hidden = false;
        demNguoc.batDau();
        otp.reset();
      } catch (err) {
        loiEl.textContent = err.message;
        loiEl.hidden = false;
      } finally {
        btn.classList.remove("is-loading");
      }
    });

    document.getElementById("form-buoc-2").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loiEl = document.getElementById("loi-buoc-2");
      const btn = e.target.querySelector("button[type=submit]");
      loiEl.hidden = true;

      const maXacNhan = otp.layDayDuMa();
      if (maXacNhan.length < 6) {
        otp.baoLoi();
        loiEl.textContent = "Vui lòng nhập đủ 6 số";
        loiEl.hidden = false;
        return;
      }

      btn.classList.add("is-loading");
      try {
        await apiPost("/auth/dang-ky", {
          email: thongTinDangKy.email,
          ma_xac_nhan: maXacNhan,
        });
        window.location.href = "dang-nhap.html";
      } catch (err) {
        otp.baoLoi();
        loiEl.textContent = err.message;
        loiEl.hidden = false;
        btn.classList.remove("is-loading");
      }
    });
  </script>
</body>
</html>
